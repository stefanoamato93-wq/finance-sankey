<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal finance</title>
<style>
  :root{
    --bg:#0f1420; --panel:#151b2b; --ink:#e7ecf5; --muted:#9aa6bd;
    --income:#3aa86a; --budget:#586a86;
    --needs:#5b8fd0; --wants:#e08a3c; --liberality:#b57fd6; --taxes:#c85c5c; --savings:#e7c14a;
    --grid:#243049; --exp:#d98a4a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
       font-family:"Amazon Ember","Segoe UI",Calibri,Arial,sans-serif;}
  header{padding:16px 26px 4px;}
  h1{margin:0; font-size:19px; font-weight:700;}
  h2{margin:0; font-size:14px; font-weight:700;}
  .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .controls{margin:12px 26px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px;}
  select{background:var(--panel); color:var(--ink); border:1px solid var(--grid); border-radius:7px; padding:5px 8px;}
  .controls label{color:var(--muted); cursor:pointer;}
  .totals{display:flex; gap:12px; margin:12px 26px 0; flex-wrap:wrap;}
  .tot{background:var(--panel); border:1px solid var(--grid); border-radius:10px; padding:8px 12px; min-width:96px;}
  .tot .lab{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .tot .val{font-size:18px; font-weight:700; margin-top:2px;}
  .tot .pct{font-size:11px; color:var(--muted); margin-top:1px;}
  .period{margin:8px 26px 0; color:var(--muted); font-size:12px;}
  .status{margin:16px 26px; color:var(--muted); font-size:13px;}
  .status.err{color:#e58a8a;}
  .framed{border:1px solid var(--grid); background:var(--panel); border-radius:12px;}
  .wrap{margin:10px 26px 8px; padding:12px 16px; max-width:940px; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  svg{width:100%; height:auto; display:block; overflow:visible;}
  .node text{fill:var(--ink); font-size:11px; dominant-baseline:middle;}
  .node .nval{fill:var(--muted); font-size:10px;}
  text.mid{fill:#fff; font-weight:600; font-size:10.5px; paint-order:stroke; stroke:var(--bg); stroke-width:3.4px; stroke-linejoin:round;}
  .link{fill-opacity:.36; transition:fill-opacity .15s;}
  .link:hover{fill-opacity:.7;}
  /* de-emphasized (deselected) entries: greyed, reduced opacity, but still tappable to reactivate */
  .node.deselected{opacity:.28; filter:grayscale(1);}
  .node.deselected rect{cursor:pointer;}
  .link.deselected{fill-opacity:.12; filter:grayscale(1); pointer-events:none;}
  .tip{position:fixed; pointer-events:none; background:#0b0f18; color:#fff; border:1px solid var(--grid);
       border-radius:6px; padding:6px 9px; font-size:12px; opacity:0; transition:opacity .1s; z-index:30; white-space:nowrap;}
  #mini{position:fixed; pointer-events:none; background:#0b0f18; border:1px solid var(--grid); border-radius:9px;
        padding:8px 10px; opacity:0; transition:opacity .1s; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.55);}
  #mini .mt{font-size:11px; color:#fff; font-weight:700; margin-bottom:4px;}
  #mini text.mtx{fill:var(--ink); font-size:9.5px; dominant-baseline:middle;}
  /* Detail panel: one overlay per clicked Sankey entry. Holds the nested breakdown
     Sankey, a monthly-trend view, and the include/exclude control. Replaces the
     per-name bar-chart glyphs that used to sit next to every label. */
  #detail{position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:40;
        max-width:min(700px,94vw); max-height:88vh; overflow-y:auto;
        padding:12px 14px; box-shadow:0 12px 40px rgba(0,0,0,.6);}
  #detail .dhead{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:4px;}
  #detail .dtitle{font-size:14px; font-weight:700; color:#fff;}
  #detail .dsub{font-size:11.5px; color:var(--muted); margin-top:2px;}
  #detail .dacts{display:flex; gap:7px; flex-wrap:wrap; justify-content:flex-end;}
  #detail button{background:var(--panel); color:var(--muted); border:1px solid var(--grid);
        border-radius:8px; padding:7px 11px; cursor:pointer; font-size:12.5px; min-height:38px;
        font-family:inherit; white-space:nowrap;}
  #detail button:hover{color:var(--ink);}
  #detail button.on{color:#fff; border-color:#3a4d78; background:#1c2947;}
  #detail button.excl{color:#e7c14a; border-color:rgba(231,193,74,.4);}
  #detail .dcrumb{font-size:11.5px; color:var(--muted); margin:2px 0 6px; cursor:pointer;}
  #detail .dcrumb:hover{color:var(--ink);}
  #detail svg{max-width:100%;}
  #detail text.dval{fill:var(--muted); font-size:8.5px; font-variant-numeric:tabular-nums;}
  #detail text.dmon{fill:var(--ink); font-size:9px;}
  #detail line.daxis{stroke:var(--grid); stroke-width:1;}
  #detail text.dtx{fill:var(--ink); font-size:10px; dominant-baseline:middle;}
  #detail g.drow{cursor:pointer;}
  #detail g.drow:hover text.dtx{fill:#fff;}
  #detail g.drow rect.dhit{fill:transparent;}
  #detail .dmsg{color:var(--muted); font-size:12.5px; padding:18px 10px; text-align:center;}
  #detail .dhintrow{color:var(--muted); font-size:11px; margin-top:6px;}
  /* mobile/touch parity: an enlarged transparent tap target around each selectable
     node body. The visible bar can be as thin as MINSLOT (~22u ~=18px at the mobile
     720px diagram width, 0.8px/u), so a >=55u (>=44px) overlay carries the same tap.
     Inert on desktop (pointer-events:none) so the node's hover preview is preserved. */
  .node .nodehit{fill:transparent; pointer-events:none;}
  @media (max-width:480px){ .node .nodehit{pointer-events:auto; cursor:pointer;} }
  /* excluded-entries reset pill in the controls row */
  #exclBox{display:none; align-items:center; gap:8px;}
  #exclReset{background:var(--panel); color:#e7c14a; border:1px solid rgba(231,193,74,.4);
        border-radius:8px; padding:5px 10px; cursor:pointer; font-size:12px; font-family:inherit;}
  /* draggable month-range slider */
  #rangeBox{margin:10px 26px 0; max-width:640px;}
  .rangelabels{display:flex; justify-content:space-between; font-size:12px; color:var(--ink); margin-bottom:3px;}
  .dual{position:relative; height:26px; user-select:none; touch-action:none;}
  /* touch-action is NOT inherited, so it has to be set on the draggable children too,
     otherwise a touch/pen drag that starts on a handle or on the band is taken over by
     the browser as a pan gesture and the range bar never moves (the "horizontal drag
     does not work" bug). */
  .dual .track,.dual .fill,.dual .handle{touch-action:none;}
  .dual .track{position:absolute; top:11px; left:0; right:0; height:4px; background:var(--grid); border-radius:3px; z-index:1;}
  .dual .fill{position:absolute; top:9px; height:8px; background:var(--income); opacity:.5; border-radius:4px; z-index:2; cursor:grab;}
  .dual .handle{position:absolute; top:4px; width:16px; height:16px; margin-left:-8px; border-radius:50%;
     background:#fff; border:2px solid var(--income); z-index:3; cursor:grab;}
  /* enlarged invisible grab area at every viewport width (not only on the mobile
     breakpoint), so a landscape phone/tablet still gets a comfortable target */
  .dual .handle::before{content:""; position:absolute; top:-12px; left:-12px; right:-12px; bottom:-12px;}
  /* net worth */
  .nwhead{margin:18px 26px 0;}
  .nwsub{color:var(--muted); font-size:12px; margin-top:2px;}
  /* headline cards: just Net worth + Total assets, side by side, compact */
  .nwcards{display:flex; gap:10px; margin:10px 26px 0; max-width:560px;}
  .nwcard{flex:1 1 0; min-width:0; background:linear-gradient(180deg,#182135,#141a28);
          border:1px solid var(--grid); border-radius:11px; padding:8px 12px;}
  .nwcard .lab{font-size:9.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px;}
  .nwcard .big{font-size:21px; font-weight:800; line-height:1.1; margin-top:1px; color:var(--ink);
               font-variant-numeric:tabular-nums;}
  .nwcard.net{border-color:#3a4d78; background:linear-gradient(180deg,#1c2947,#141d31);}
  .nwcard.net .big{font-size:24px;}
  .nwcard.assets .big{color:#7fd0a3;}
  /* two-column table (name | value) so it always fits the viewport, no sideways scroll */
  .nwwrap{margin:12px 26px 40px; padding:6px 8px; max-width:560px;}
  table.nw{border-collapse:collapse; font-size:12.5px; width:100%; table-layout:fixed;
           font-variant-numeric:tabular-nums;}
  .nw th,.nw td{padding:7px 10px; text-align:right; border-bottom:1px solid var(--grid);}
  .nw th{color:var(--muted); font-weight:600; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px;}
  .nw th.grp{text-align:left;}
  .nw col.cval{width:34%;}
  .nw td.t{text-align:left; color:var(--ink); word-break:break-word;}
  .nw td.t2{text-align:left; color:var(--ink); padding-left:24px; word-break:break-word;}
  .nw td .acd{display:block; color:var(--muted); font-size:11px; margin-top:1px;}
  .nw td.val{white-space:nowrap;}
  .nw tbody tr:hover td{background:rgba(255,255,255,.035);}
  .nw tr.sub td{background:#141d30; font-weight:700; text-transform:uppercase; font-size:11.5px;
                letter-spacing:.5px; border-top:1px solid var(--grid);}
  .nw tr.sub td.t{border-left:3px solid var(--budget);}
  .nw tr.sub .val{font-size:13.5px;}
  .nw tr.cat td{background:#0e1524; font-weight:600; color:var(--muted);}
  .nw tr:last-child td{border-bottom:none;}
  /* collapsible category groups: the category row is the only thing shown until it is
     clicked, then its account / asset-class rows appear underneath */
  /* expand all / collapse all controls above the net worth table */
  .nwtools{display:flex; gap:6px; justify-content:flex-end; margin:0 0 6px;}
  .nwtools button{background:#141d30; color:var(--ink); border:1px solid var(--grid); border-radius:6px;
                  padding:4px 10px; font-size:11px; cursor:pointer;}
  .nwtools button:hover{background:#18233a;}
  .nwtools button:disabled{opacity:.4; cursor:default;}
  .nw tr.cgroup{cursor:pointer;}
  .nw tr.cgroup:hover td{background:#18233a;}
  .nw tr.cgroup td.t{border-left:3px solid var(--budget);}
  .nw .tw{display:inline-block; width:13px; color:var(--muted); font-size:11px;}
  .nw .cnt{color:var(--muted); font-weight:400; font-size:11px; text-transform:none; letter-spacing:0;}
  .nw tr.kid td{background:#0e1524;}
  .nw .val{color:var(--ink); font-weight:600;}
  .nw .neg{color:#e58a8a;} .nw .pos{color:#7fd0a3;}
  /* data-source freshness badge (shown when displaying last-loaded/cached data) */
  .badge{margin:8px 26px 0; display:inline-block; color:#e7c14a; font-size:11.5px;
         background:rgba(231,193,74,.10); border:1px solid rgba(231,193,74,.35);
         border-radius:7px; padding:4px 9px;}
  /* mobile: adapt every section — controls, cards, table, touch targets — and keep the
     Sankey legible by rendering it wider inside its own horizontal scroll frame */
  @media (max-width:680px){
    /* never let the whole page scroll sideways; only the diagram/table frames do */
    html,body{overflow-x:hidden; max-width:100%;}
    header{padding:12px 16px 4px;}
    .controls,.totals,.period,.status,.badge,#rangeBox,.nwhead,.nwcards,#skeleton{margin-left:14px; margin-right:14px;}
    #skeleton{max-width:100%;}
    /* controls: full-width, comfortable tap targets (>=44px), >=8px gaps */
    .controls{gap:10px; font-size:14px;}
    .controls > *{min-height:44px;}
    .controls label{display:flex; align-items:center; gap:8px; min-height:44px;}
    .controls select, #year, #month{min-height:44px; padding:8px 10px; font-size:14px; flex:1 1 auto;}
    .controls input[type=checkbox]{width:22px; height:22px;}
    /* range slider: enlarge the invisible hit area of each handle to ~48px for touch */
    #rangeBox{max-width:100%;}
    .dual{height:34px;}
    .dual .track{top:15px;} .dual .fill{top:13px;}
    .dual .handle{top:7px; width:20px; height:20px; margin-left:-10px;}
    .dual .handle::before{content:""; position:absolute; top:-14px; left:-14px; right:-14px; bottom:-14px;}
    .wrap{margin:10px 14px 8px; padding:8px;}
    .wrap svg{min-width:720px;}
    .node text{font-size:13px;} .node .nval{font-size:12px;} text.mid{font-size:12px;}
    /* headline cards stay side by side (they are only two now), just tighter */
    .nwcards{gap:8px; max-width:100%;}
    .nwcard{padding:8px 10px;}
    .nwcard .big{font-size:19px;} .nwcard.net .big{font-size:21px;}
    /* assets table: fits the screen, never scrolls sideways */
    .nwwrap{margin-left:14px; margin-right:14px; max-width:100%; padding:4px 2px;}
    table.nw{font-size:12px;}
    .nw th{font-size:11px;}
    .nw th,.nw td{padding:8px 6px;}
    .nw td.t2{padding-left:16px;}
    .nw col.cval{width:38%;}
    .swipehint{display:block;}
  }
  .swipehint{display:none; margin:4px 14px 0; color:var(--muted); font-size:11px;}
  /* skeleton Loading_State — present at first paint (no JS), CSS-only shimmer,
     mirrors the real layout so there is never a blank/unstyled gap before render */
  #skeleton{margin:12px 26px 40px; max-width:940px;}
  .sk{position:relative; overflow:hidden; background:var(--panel);
      border:1px solid var(--grid); border-radius:10px; display:block;}
  .sk::after{content:""; position:absolute; inset:0;
      background:linear-gradient(90deg, transparent, rgba(255,255,255,.07), transparent);
      transform:translateX(-100%); animation:sk-shimmer 1.4s ease-in-out infinite;}
  @keyframes sk-shimmer{100%{transform:translateX(100%);}}
  .sk-controls{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px;}
  .sk-pill{width:150px; height:34px; border-radius:8px;} .sk-pill.sk-sm{width:90px;}
  .sk-range{height:26px; width:min(640px,100%); margin-bottom:18px;}
  .sk-cards{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:16px;}
  .sk-card{flex:1 1 180px; height:84px; border-radius:14px;} .sk-card.big{flex:1.4 1 220px;}
  .sk-sankey{height:360px; margin-bottom:18px; border-radius:12px;}
  .sk-table{display:flex; flex-direction:column; gap:10px;}
  .sk-row{height:26px; width:100%; border-radius:6px;}
  @media (prefers-reduced-motion:reduce){ .sk::after{animation:none;} }
</style>
</head>
<body>
<header>
  <h1>Personal finance</h1>
</header>

<!-- headline net worth / total assets / total liabilities: top of the page, above the flow -->
<div class="nwcards" id="nwcards"></div>

<div class="controls" id="controls" style="display:none">
  <label>Quick set
    <select id="mode">
      <option value="trailing">Trailing 12 months</option>
      <option value="month">Single month</option>
      <option value="year">Full year</option>
      <option value="all">All time</option>
    </select>
  </label>
  <select id="year"></select>
  <select id="month"></select>
  <label><input type="checkbox" id="t12"> trailing 12 months</label>
  <label><input type="checkbox" id="tMonthly"> per month (avg)</label>
  <label><input type="checkbox" id="tK"> values in K</label>
  <span id="exclBox"><span id="exclCount"></span><button id="exclReset" type="button">Include all</button></span>
</div>

<div id="rangeBox" style="display:none">
  <div class="rangelabels"><span id="rLo"></span><span id="rHi"></span></div>
  <div class="dual" id="dual">
    <div class="track"></div>
    <div class="fill" id="rFill"></div>
    <div class="handle" id="hLo"></div>
    <div class="handle" id="hHi"></div>
  </div>
</div>

<!-- skeleton Loading_State: visible at first paint, hidden the moment real content renders -->
<div id="skeleton" aria-hidden="true">
  <div class="sk-controls">
    <span class="sk sk-pill"></span><span class="sk sk-pill"></span>
    <span class="sk sk-pill sk-sm"></span><span class="sk sk-pill sk-sm"></span>
  </div>
  <div class="sk sk-range"></div>
  <div class="sk-cards">
    <span class="sk sk-card"></span><span class="sk sk-card"></span><span class="sk sk-card"></span>
  </div>
  <div class="sk sk-sankey"></div>
  <div class="sk-cards">
    <span class="sk sk-card big"></span><span class="sk sk-card"></span><span class="sk sk-card"></span>
  </div>
  <div class="sk-table">
    <span class="sk sk-row"></span><span class="sk sk-row"></span><span class="sk sk-row"></span>
    <span class="sk sk-row"></span><span class="sk sk-row"></span>
  </div>
</div>

<div class="status" id="status" style="display:none">Loading data from Google Sheets…</div>
<div class="badge" id="dataBadge" style="display:none"></div>
<div class="period" id="periodLabel"></div>
<div class="totals" id="totals"></div>
<div class="swipehint" id="swipehint">Swipe the diagram sideways to see it all →</div>
<div class="wrap framed"><svg id="sankey" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg></div>

<div class="nwhead" id="nwhead" style="display:none">
  <h2>Assets &amp; liabilities</h2>
  <div class="nwsub">Tap a category to see the accounts inside it.</div>
</div>
<div class="nwwrap framed" id="nwwrap"></div>

<div class="tip" id="tip"></div>
<div id="mini"><div class="mt" id="miniTitle"></div><svg id="miniSvg"></svg></div>

<!-- Detail panel: opens on clicking any Sankey entry (breakdown Sankey / monthly
     trend / include-exclude), hidden until then -->
<div id="detail" class="framed" style="display:none">
  <div class="dhead">
    <div>
      <div class="dtitle" id="dTitle"></div>
      <div class="dsub" id="dSub"></div>
    </div>
    <div class="dacts">
      <button id="dBreakBtn" type="button">Breakdown</button>
      <button id="dTrendBtn" type="button">Monthly trend</button>
      <button id="dYearBtn" type="button">Yearly trend</button>
      <button id="dExcl" type="button" class="excl">Exclude</button>
      <button id="dClose" type="button">Close</button>
    </div>
  </div>
  <div class="dcrumb" id="dCrumb" style="display:none"></div>
  <svg id="dSvg"></svg>
  <div class="dmsg" id="dMsg" style="display:none"></div>
  <div class="dhintrow" id="dHint" style="display:none"></div>
</div>

<script>
/* ---- data source --------------------------------------------------------- */
const SHEET_ID="1SnEHP7oBD9Fo38yQ0OvlhYESiidmY98f9fqfHNhDLnc";
const SHEET_NAME="DB";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

const INCGRP={WORKINCOME:"Work income",NONWORKINCOME:"Non-work income"};
const EXPGRP={NEEDS:"Needs",WANTS:"Wants",LIBERALITY:"Liberality"};
const norm=s=> s==null ? "" : String(s).trim().toUpperCase();
const MOBILE_BP=680;
const isMobile=w=> (w==null?window.innerWidth:w) <= MOBILE_BP;   // <=680px resolves to mobile
const noHover=()=> typeof window.matchMedia==='function' && window.matchMedia('(hover:none)').matches;

let DATA=[], DETAIL=[], NWHOLD=[], META={years:[],minMi:0,maxMi:0,allMinMi:0,allMaxMi:0,refMonth:1,refWindow:1,
  refs:{trailing12:{income:1,months:12},singleMonth:{income:1,months:1},fullYear:{income:1,months:12},allTime:{income:1,months:1}}};

/* minimal RFC4180 CSV parser */
function parseCSV(text){
  const rows=[]; let row=[], field="", i=0, q=false;
  while(i<text.length){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"'; i++;} else q=false; } else field+=c; }
    else{
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==='\r'){}
      else field+=c;
    }
    i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}

function aggregate(rows){
  const head=rows[0].map(norm), ix=n=>head.indexOf(n);
  const cY=ix("YEAR"),cM=ix("MONTH"),cV=ix("VALUE"),cL=ix("LABEL"),cD=ix("DETAIL"),
        cACD=ix("ASSETCLASSDETAILS"),cT=ix("TYPE"),cC1=ix("CATEGORY1"),
        cACC=ix("ACCOUNT"),cVAR=ix("VARIABLE"),cC3=ix("CATEGORY3");
  const agg=new Map(), det=new Map(), years=new Set();
  const HOLD=new Map(), incByMi={}; let allMin=Infinity, allMax=-Infinity;
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row || row[cY]===undefined || row[cY]==="") continue;
    const year=parseInt(row[cY],10), month=parseInt(row[cM],10); if(!year||!month) continue;
    const val=parseFloat(row[cV])||0;
    const label=row[cL], detail=row[cD], typ=norm(row[cT]), c1=norm(row[cC1]);
    const mi=year*12+(month-1); years.add(year);
    if(mi<allMin) allMin=mi; if(mi>allMax) allMax=mi;
    /* net worth holding — every row contributes to a balance (incl. appreciation/transfers/liabilities) */
    const vary=norm(cVAR>=0?row[cVAR]:"")||"OTHER";
    const acd=norm(cACD>=0?row[cACD]:"")||"—";
    const acct=norm(cACC>=0?row[cACC]:"")||"—";
    const cat=norm(cC3>=0?row[cC3]:"")||"—";
    const hk=vary+"|"+acd+"|"+acct+"|"+cat;
    let h=HOLD.get(hk); if(!h){ h={vary,acd,acct,cat,flows:{}}; HOLD.set(hk,h); }
    h.flows[mi]=(h.flows[mi]||0)+val;
    /* cash flow (income/expenses only) */
    let kind,group,leaf;
    if(typ==="INCOME"){ kind="I"; group=INCGRP[c1]||"Other income"; leaf=norm(detail); incByMi[mi]=(incByMi[mi]||0)+val; }
    else if(typ==="EXPENSES"){ kind="E"; group=EXPGRP[c1]||"Other"; leaf=norm(label); }
    else if(typ==="TAXES"){ if(norm(detail)==="APPRECTAXES") continue; kind="E"; group="Taxes"; leaf=norm(label); }
    else continue;   // TRANSFER / APPRECIATION excluded from cash flow (still in net worth)
    if(!leaf) continue;
    agg.set(mi+"|"+kind+"|"+group+"|"+leaf,(agg.get(mi+"|"+kind+"|"+group+"|"+leaf)||0)+val);
    if(kind==="E"){ const dn=(detail!=null && String(detail).trim()!=="") ? String(detail).trim() : leaf;
      det.set(mi+"|"+leaf+"|"+dn,(det.get(mi+"|"+leaf+"|"+dn)||0)+(-val)); }
  }
  DATA=[...agg.entries()].map(([k,v])=>{ const [mi,kind,group,leaf]=k.split("|"); return [+mi,kind,group,leaf,Math.round(v)]; });
  DETAIL=[...det.entries()].map(([k,v])=>{ const [mi,leaf,dn]=k.split("|"); return [+mi,leaf,dn,Math.round(v)]; });
  NWHOLD=[...HOLD.values()];
  const mis=DATA.map(r=>r[0]);
  /* ---- per-Comparison_Mode scale references (income-based) ------------------
     Each reference is the MAX income of that mode across the loaded history, so
     any in-mode window's income is <= the reference and maps to <= TARGET_H.
     mi = year*12+(month-1); calendar year = floor(mi/12). */
  const im=Object.keys(incByMi).map(Number);
  const distinctMonths=im.length;                       // months present with income
  /* singleMonth: largest single-month income */
  let singleMonth=0; for(const k in incByMi) singleMonth=Math.max(singleMonth, incByMi[k]);
  /* allTime: total income over the full history */
  let allTime=0; for(const k in incByMi) allTime+=incByMi[k];
  /* trailing12: max total income over any COMPLETE 12-consecutive-month window;
     if fewer than 12 months of span are present, the sum over all months present */
  let trailing12=0, monthsTrailing12=12;
  if(im.length){
    const lo=Math.min(...im), hi=Math.max(...im), span=hi-lo+1;
    if(span>=12){
      for(let end=lo+11; end<=hi; end++){ let s=0; for(let m=end-11;m<=end;m++) s+=incByMi[m]||0; trailing12=Math.max(trailing12,s); }
    } else {
      trailing12=allTime; monthsTrailing12=span;         // fewer than 12 months present
    }
  }
  /* fullYear: max calendar-year total income across all calendar years present */
  let fullYear=0; { const byYear={}; for(const k in incByMi){ const y=Math.floor((+k)/12); byYear[y]=(byYear[y]||0)+incByMi[k]; }
    for(const y in byYear) fullYear=Math.max(fullYear, byYear[y]); }
  /* floor every reference income to a positive value (>=1) so heights stay finite */
  const floorPos=v=>Math.max(1,v);
  const refs={
    trailing12:  { income: floorPos(trailing12),  months: monthsTrailing12 },
    singleMonth: { income: floorPos(singleMonth), months: 1 },
    fullYear:    { income: floorPos(fullYear),    months: 12 },
    allTime:     { income: floorPos(allTime),     months: distinctMonths || 1 }
  };
  META={years:[...years].sort((a,b)=>a-b), minMi:Math.min(...mis), maxMi:Math.max(...mis),
        allMinMi:allMin, allMaxMi:allMax, refs,
        /* superseded by refs.singleMonth/refs.trailing12; kept until task 1.3 removes the last reader */
        refMonth:refs.singleMonth.income, refWindow:refs.trailing12.income};
}

/* ---- Scale_Engine: active Scale_Reference (pure) --------------------------
   scaleReferenceFor(mode, monthly, refs) -> positive number.
   Maps the Comparison_Mode to its base reference income
   (trailing->trailing12, month->singleMonth, year->fullYear, all->allTime).
   When the "per month (avg)" toggle is on, divides that base income by the
   mode's reference-window month count; otherwise uses the undivided income.
   Reads only (mode, monthly, refs) so the result is window-independent (it
   never touches miF/miT), and is clamped to a positive floor (>=1) so heights
   stay finite when the largest income is zero. build() consumes this in
   task 1.4 as curScale = TARGET_H / scaleReferenceFor(mode, monthly, refs). */
function scaleReferenceFor(mode, monthly, refs){
  const MODE_KEY={trailing:'trailing12', month:'singleMonth', year:'fullYear', all:'allTime'};
  const ref=(refs && refs[MODE_KEY[mode]]) || (refs && refs.trailing12);
  const income=ref ? ref.income : 1;
  const months=(ref && ref.months>0) ? ref.months : 1;
  return Math.max(1, monthly ? income/months : income);
}

/* ---- Savings_Calculator: savings percentage (pure) ------------------------
   savingsPercentage(selectedIncome, selectedExpenses) -> number | null.
   Returns null when selectedIncome <= 0 (caller shows a non-numeric
   placeholder like "—" instead of dividing). Otherwise returns
   (selectedIncome - selectedExpenses) / selectedIncome * 100, rounded to one
   decimal place; negative results are allowed. Never returns NaN or Infinity.
   paintTotals consumes this in task 4.3. */
function savingsPercentage(selectedIncome, selectedExpenses){
  if(!(selectedIncome>0)) return null;
  return Math.round((selectedIncome-selectedExpenses)/selectedIncome*1000)/10;
}

function computeLinks(miF,miT){
  const incLeaf={}, incGrpOf={}, expLeaf={}, expGrpOf={}, monthsSeen={};
  DATA.forEach(([mi,kind,grp,leaf,val])=>{
    if(mi<miF||mi>miT) return; monthsSeen[mi]=1;
    if(kind==='I'){ incLeaf[leaf]=(incLeaf[leaf]||0)+val; incGrpOf[leaf]=grp; }
    else { expLeaf[leaf]=(expLeaf[leaf]||0)+(-val); expGrpOf[leaf]=grp; }
  });
  const incGrp={}, expGrp={}; let income=0, outflow=0; const links=[];
  for(const leaf in incLeaf){ const v=incLeaf[leaf]; if(v>0){ const g=incGrpOf[leaf];
    links.push([leaf,g,v]); incGrp[g]=(incGrp[g]||0)+v; income+=v; } }
  for(const g in incGrp) links.push([g,'Total income',incGrp[g]]);
  const eb=[];
  for(const leaf in expLeaf){ const v=expLeaf[leaf]; if(v>0){ const g=expGrpOf[leaf];
    expGrp[g]=(expGrp[g]||0)+v; outflow+=v; eb.push([g,leaf,v]); } }
  // total income -> one merged Expenses node -> macro groups -> leaves
  if(outflow>0) links.push(['Total income','Expenses',outflow]);
  for(const g in expGrp) links.push(['Expenses',g,expGrp[g]]);
  eb.forEach(x=>links.push(x));
  const sav=income-outflow; if(sav>0) links.push(['Total income','Savings',sav]);
  return {links, income, expGrp, sav, months:Object.keys(monthsSeen).length||1};
}

/* ---- Interactive selection: filter the diagram by Selection_State (pure) ---
   applySelection(res, deselected) -> { links, income, expGrp, sav, months, hidden }.
   Recomputes the computeLinks() result over ONLY the selected entries, keyed by
   the window-independent Entry identities:
     income leaf         -> "I|"+leaf
     income group        -> "IG|"+group
     expense macro group -> "EG|"+group
     expense leaf        -> "E|"+leaf
   An income (or expense) leaf is kept only when neither its own key nor its
   group key is in `deselected`. Income-group subtotals + total income and the
   expense-group subtotals + outflow are recomputed from the kept leaves, and
   sav = income - outflow. The returned object has the SAME shape computeLinks
   produces (links / income / expGrp / sav / months, in the same link order) so
   render()/paintTotals() consume it unchanged, PLUS `hidden`: the set of the
   in-window Entry keys that are deselected, so render() can draw them
   de-emphasized. The empty deselected set is the identity — the result equals
   the input totals and an equivalent links array. Pure: reads only its two
   args, no DOM and no module-scope globals. applySelection is wired into
   build() (before render/paintTotals) in task 2.5. */
function applySelection(res, deselected){
  const ds = deselected || new Set();
  const links = (res && res.links) || [];
  /* 1) recover the leaf/group structure from the raw [src,tgt,val] triples:
        income groups  = sources of the "-> Total income" links,
        expense groups = targets of the "Expenses ->" links. */
  const incGroupSet = new Set(), expGroupSet = new Set();
  for(const [s,t] of links){
    if(t==='Total income') incGroupSet.add(s);
    if(s==='Expenses') expGroupSet.add(t);
  }
  /* income leaf link = [leaf, group, v] (target is an income group);
     expense leaf link = [group, leaf, v] (source is an expense group).
     Preserve link-array order so the rebuilt links match computeLinks exactly. */
  const incLeaves=[], expLeaves=[];
  for(const [s,t,v] of links){
    if(incGroupSet.has(t)) incLeaves.push({leaf:s, group:t, v});
    else if(expGroupSet.has(s)) expLeaves.push({group:s, leaf:t, v});
  }
  /* 2) hidden = in-window Entry keys that are currently deselected. */
  const hidden = new Set();
  const mark=k=>{ if(ds.has(k)) hidden.add(k); };
  incGroupSet.forEach(g=>mark('IG|'+g));
  expGroupSet.forEach(g=>mark('EG|'+g));
  incLeaves.forEach(x=>mark('I|'+x.leaf));
  expLeaves.forEach(x=>mark('E|'+x.leaf));
  /* 3) recompute the income side over selected leaves only. */
  const incGrp={}, incGrpOrder=[]; let income=0; const outLinks=[];
  const keptInc=[];
  for(const {leaf,group,v} of incLeaves){
    if(ds.has('I|'+leaf) || ds.has('IG|'+group)) continue;
    keptInc.push([leaf,group,v]);
    if(!(group in incGrp)){ incGrp[group]=0; incGrpOrder.push(group); }
    incGrp[group]+=v; income+=v;
  }
  keptInc.forEach(l=>outLinks.push(l));
  incGrpOrder.forEach(g=>outLinks.push([g,'Total income',incGrp[g]]));
  /* 4) recompute the expense side over selected leaves only. */
  const expGrp={}, expGrpOrder=[]; let outflow=0; const eb=[];
  for(const {group,leaf,v} of expLeaves){
    if(ds.has('E|'+leaf) || ds.has('EG|'+group)) continue;
    if(!(group in expGrp)){ expGrp[group]=0; expGrpOrder.push(group); }
    expGrp[group]+=v; outflow+=v; eb.push([group,leaf,v]);
  }
  if(outflow>0) outLinks.push(['Total income','Expenses',outflow]);
  expGrpOrder.forEach(g=>outLinks.push(['Expenses',g,expGrp[g]]));
  eb.forEach(x=>outLinks.push(x));
  const sav=income-outflow; if(sav>0) outLinks.push(['Total income','Savings',sav]);
  return {links:outLinks, income, expGrp, sav, months:(res&&res.months)||1, hidden};
}

/* ---- ghost (stub) links for in-window deselected entries ------------------
   ghostLinks(raw, res) -> [{ s, t, node, key }, ...].
   applySelection() already removed the deselected entries from the sized links;
   this rebuilds a light, zero-value connector for each in-window `hidden` key so
   render() can draw it as a greyed, minimum-height stub node (still tappable to
   reactivate) with a dimmed flow. Group membership is recovered from the RAW
   (pre-selection) structure; a leaf whose own group is no longer part of the
   sized diagram is anchored to the nearest surviving backbone node so the stub
   still lays out sensibly. `node` names the entry's own node (the one that gets
   the .deselected treatment and the reactivate tap). Returns [] when nothing is
   hidden, so a diagram with an empty Selection_State is byte-for-byte unchanged. */
function ghostLinks(raw, res){
  const hid = (res && res.hidden) || new Set();
  if(!hid.size) return [];
  const rlinks = (raw && raw.links) || [];
  const incGroupSet=new Set(), expGroupSet=new Set();
  for(const [s,t] of rlinks){ if(t==='Total income') incGroupSet.add(s); if(s==='Expenses') expGroupSet.add(t); }
  const grpOfIncLeaf={}, grpOfExpLeaf={};
  for(const [s,t] of rlinks){
    if(incGroupSet.has(t)) grpOfIncLeaf[s]=t;         // income leaf -> its income group
    else if(expGroupSet.has(s)) grpOfExpLeaf[t]=s;    // expense leaf -> its macro group
  }
  /* nodes that survive into the sized (selected) diagram */
  const real=new Set(); for(const [s,t] of ((res&&res.links)||[])){ real.add(s); real.add(t); }
  const ghosts=[];
  hid.forEach(key=>{
    const p=key.indexOf('|'), kind=key.slice(0,p), name=key.slice(p+1);
    if(kind==='I'){                                   // income leaf
      const g=grpOfIncLeaf[name];
      ghosts.push({s:name, t: real.has(g)? g : 'Total income', node:name, key});
    } else if(kind==='IG'){                           // income macro group
      ghosts.push({s:name, t:'Total income', node:name, key});
    } else if(kind==='EG'){                           // expense macro group
      ghosts.push({s: real.has('Expenses')?'Expenses':'Total income', t:name, node:name, key});
    } else if(kind==='E'){                            // expense leaf
      const g=grpOfExpLeaf[name];
      const src = real.has(g)? g : (real.has('Expenses')?'Expenses':'Total income');
      ghosts.push({s:src, t:name, node:name, key});
    }
  });
  return ghosts;
}
function detailFor(leaf){
  const d={};
  DETAIL.forEach(([mi,lf,dn,v])=>{ if(lf===leaf && mi>=curMiF && mi<=curMiT) d[dn]=(d[dn]||0)+v; });
  return Object.entries(d).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
}

/* ---- Drilldown_Chart: per-month category series (pure) --------------------
   monthlySeries(kind, category, miF, miT, DATA, DETAIL) -> [{mi, value}, ...].

   Sums a single drilled category's euro amounts per month index, drawing from
   the same source and using the same sign convention as the rest of the app:
     kind==='income'  -> DATA rows with kind 'I' whose leaf === category;
                         income vals are stored positive (as computeLinks reads
                         them), summed as-is.
     kind==='expense' -> DATA rows with kind 'E' whose leaf === category;
                         expense vals are stored negative, flipped to a positive
                         spend exactly as computeLinks does (-val).
     kind==='detail'  -> DETAIL rows whose sub-category dn === category; DETAIL
                         values are already positive (as detailFor reads them).

   Emits EXACTLY one {mi, value} point per month index in [miF, miT],
   chronological oldest->newest with indices exactly miF..miT (inclusive),
   value 0 for months with no activity, and NO point for any month outside the
   window (mi = year*12+(month-1)). Pure: reads only its arguments. Consumed by
   the Detail_Panel's trend view (seriesOf). */
function monthlySeries(kind, category, miF, miT, data, detail){
  const rows = kind==='detail' ? (detail||[]) : (data||[]);
  const sums = {};                                    // mi -> summed value
  if(kind==='detail'){
    rows.forEach(([mi,lf,dn,v])=>{
      if(dn!==category || mi<miF || mi>miT) return;
      sums[mi]=(sums[mi]||0)+v;                        // DETAIL values already positive
    });
  } else {
    const wantKind = kind==='income' ? 'I' : 'E';
    rows.forEach(([mi,k,grp,leaf,val])=>{
      if(k!==wantKind || leaf!==category || mi<miF || mi>miT) return;
      sums[mi]=(sums[mi]||0)+(wantKind==='I' ? val : -val);   // expenses stored negative -> positive spend
    });
  }
  const out=[];
  for(let mi=miF; mi<=miT; mi++) out.push({ mi, value: sums[mi]||0 });   // one point per month, oldest->newest
  return out;
}

/* ---- Drilldown_Chart: per-year rollup of a monthly series (pure) ----------
   bucketByYear(points) -> [{year, mi, value, months}, ...] oldest->newest.

   Folds a [{mi, value}] monthly series (as monthlySeries/seriesOf emit) into one
   entry per calendar year, where year = floor(mi/12) and months = how many
   monthly points of that year were present in the input. Emits a bucket for
   every year the input covers, including all-zero years, so the yearly trend
   keeps a continuous axis from the first year of data to the latest. Pure:
   reads only its argument. Consumed by the Detail_Panel's yearly trend view. */
function bucketByYear(points){
  const sums={}, cnt={};
  (points||[]).forEach(({mi,value})=>{
    const y=Math.floor(mi/12);
    sums[y]=(sums[y]||0)+value; cnt[y]=(cnt[y]||0)+1;
  });
  return Object.keys(sums).map(Number).sort((a,b)=>a-b)
    .map(y=>({ year:y, mi:y*12, value:sums[y], months:cnt[y] }));
}

function kindOf(name,key){

  if(name==='Total income') return 'hubIncome';
  if(name==='Expenses')     return 'hubExpenses';
  if(name==='Savings')      return 'savings';
  return 'detail';
}
function panelColor(p){
  if(p.kind==='income'||p.kind==='incGroup') return INCOME;
  if(p.kind==='hubIncome') return BUDGET;
  if(p.kind==='savings')   return GROUPCOL.Savings;
  if(p.kind==='hubExpenses') return EXPC;
  if(p.kind==='expGroup')  return GROUPCOL[p.name]||EXPC;
  return EXPC;                                    // expense leaf / detail
}
/* children of an entry inside the active window: [[label, value, childSpec|null], ...]
   ordered high -> low. Expense leaves break into their DETAIL sub-categories;
   groups and the hubs break into their leaves; income leaves and details have none. */
function childrenOf(p){
  const rows=[];
  if(p.kind==='expense'){
    detailFor(p.name).forEach(([dn,v])=> rows.push([dn, v, {name:dn, key:null, kind:'detail'}]));
  } else if(p.kind==='incGroup'||p.kind==='expGroup'||p.kind==='hubIncome'||p.kind==='hubExpenses'){
    const want=(p.kind==='incGroup'||p.kind==='hubIncome')?'I':'E', sums={};
    DATA.forEach(([mi,k,grp,leaf,val])=>{
      if(mi<curMiF||mi>curMiT||k!==want) return;
      if((p.kind==='incGroup'||p.kind==='expGroup') && grp!==p.name) return;
      sums[leaf]=(sums[leaf]||0)+(want==='I'?val:-val);
    });
    Object.keys(sums).forEach(leaf=>{ if(sums[leaf]>0)
      rows.push([leaf, sums[leaf], {name:leaf, key:(want==='I'?'I|':'E|')+leaf, kind:(want==='I'?'income':'expense')}]); });
  }
  rows.sort((a,b)=>b[1]-a[1]);
  return rows;
}
/* one {mi,value} point per month, for any entry kind. Defaults to the active
   window; pass an explicit (miF, miT) to read a different span (the yearly trend
   passes the full data range so it is window-independent).
   Leaves/details delegate to the pure monthlySeries(); groups, the hubs and
   Savings aggregate from DATA (savings = income + expenses, expenses stored negative). */
function seriesOf(p, miF, miT){
  const f = (miF==null) ? curMiF : miF, t = (miT==null) ? curMiT : miT;
  if(p.kind==='detail')  return monthlySeries('detail',  p.name, f, t, DATA, DETAIL);
  if(p.kind==='income')  return monthlySeries('income',  p.name, f, t, DATA, DETAIL);
  if(p.kind==='expense') return monthlySeries('expense', p.name, f, t, DATA, DETAIL);
  const sums={};
  DATA.forEach(([mi,k,grp,leaf,val])=>{
    if(mi<f||mi>t) return;
    if(p.kind==='savings'){ sums[mi]=(sums[mi]||0)+val; return; }
    let hit=false;
    if(p.kind==='incGroup')          hit=(k==='I' && grp===p.name);
    else if(p.kind==='expGroup')     hit=(k==='E' && grp===p.name);
    else if(p.kind==='hubIncome')    hit=(k==='I');
    else if(p.kind==='hubExpenses')  hit=(k==='E');
    if(hit) sums[mi]=(sums[mi]||0)+(k==='I'?val:-val);
  });
  const out=[]; for(let mi=f; mi<=t; mi++) out.push({mi, value:sums[mi]||0});
  return out;
}
/* the all-time monthly span, i.e. from the first month of data (2018) to the
   latest, independent of the Period_Selector. Feeds the yearly trend. */
function allTimeSpan(){ return [META.minMi, META.maxMi]; }
function openPanel(name,key,parent){
  hideMini();

  panel=p;
  if(!childrenOf(p).length) p.view='trend';       // nothing to break down -> straight to the trend
  if(dEl) dEl.style.display='';
  renderPanel();
}
function closePanel(){ panel=null; if(dEl) dEl.style.display='none'; }

/* nested Sankey of the entry's children (this is the "details with another
   sankey" view). Each row is clickable: a child with its own breakdown opens a
   nested panel, a leaf/detail row opens its monthly trend. */
function renderBreakdown(p, rows){
  const color=panelColor(p);
  let parts=rows.map(([lab,v,spec])=>[lab, v/curDiv, spec]);
  const CAP=14;
  if(parts.length>CAP){ const head=parts.slice(0,CAP), rest=parts.slice(CAP);
    head.push([`Other (${rest.length})`, rest.reduce((a,x)=>a+x[1],0), null]); parts=head; }
  const total=parts.reduce((a,x)=>a+x[1],0)||1;
  const MW=560, nodeW=11, leftX=16, rightX=150, pad=10, gap=4, minSlot=19;
  const sc=Math.max(120, Math.min(360, parts.length*26))/total;
  const slots=parts.map(x=>Math.max(x[1]*sc,minSlot));
  const contentH=slots.reduce((a,s)=>a+s,0)+gap*Math.max(0,parts.length-1), H=contentH+pad*2;
  dSvg.setAttribute('viewBox',`0 0 ${MW} ${H}`); dSvg.removeAttribute('width');
  dSvg.setAttribute('height',H); dSvg.innerHTML='';
  const leftH=total*sc, leftY=pad+(contentH-leftH)/2; let y=pad, soff=0;
  parts.forEach(([lab,v,spec],i)=>{
    const bar=v*sc, slot=slots[i], ry=y+(slot-bar)/2;
    const sx=leftX+nodeW, txx=rightX, sy=leftY+soff+bar/2, ty=ry+bar/2, xm=(sx+txx)/2, t=Math.max(bar,1)/2;
    const path=document.createElementNS(NS,'path');
    path.setAttribute('d',`M${sx},${sy-t} C${xm},${sy-t} ${xm},${ty-t} ${txx},${ty-t} L${txx},${ty+t} C${xm},${ty+t} ${xm},${sy+t} ${sx},${sy+t} Z`);
    path.setAttribute('fill',color); path.setAttribute('fill-opacity','.38'); dSvg.appendChild(path); soff+=bar;
    const g=document.createElementNS(NS,'g'); g.setAttribute('class','drow');
    const rr=document.createElementNS(NS,'rect'); rr.setAttribute('x',rightX); rr.setAttribute('y',ry);
    rr.setAttribute('width',nodeW); rr.setAttribute('height',Math.max(1,bar)); rr.setAttribute('rx',2);
    rr.setAttribute('fill',color); g.appendChild(rr);
    const tl=document.createElementNS(NS,'text'); tl.setAttribute('x',rightX+nodeW+9); tl.setAttribute('y',ry+bar/2);
    tl.setAttribute('class','dtx');
    tl.textContent=`${clipTxt(lab,236,5.6)}   ${fmt(v)} · ${(v/total*100).toFixed(0)}%`;
    const ttl=document.createElementNS(NS,'title'); ttl.textContent=lab; tl.appendChild(ttl);
    g.appendChild(tl);
    const hit=document.createElementNS(NS,'rect'); hit.setAttribute('x',rightX);
    hit.setAttribute('y',y); hit.setAttribute('width',MW-rightX); hit.setAttribute('height',slot);
    hit.setAttribute('class','dhit'); g.appendChild(hit);
    if(spec) g.addEventListener('click',ev=>{ ev.stopPropagation(); openPanel(spec.name, spec.key, p); });
    else g.style.cursor='default';
    dSvg.appendChild(g);
    y+=slot+gap;
  });
  const lr=document.createElementNS(NS,'rect'); lr.setAttribute('x',leftX); lr.setAttribute('y',leftY);
  lr.setAttribute('width',nodeW); lr.setAttribute('height',Math.max(1,leftH)); lr.setAttribute('rx',2);
  lr.setAttribute('fill',color); dSvg.appendChild(lr);
  if(dHint){ dHint.style.display=''; dHint.textContent='Tap a row to go one level deeper.'; }
}
/* bar chart for the entry: one bar per period, zero-height where there is no
   activity, values honouring the K toggle. Shared by both trend views.
     bars = [{label, value}, ...] oldest -> newest
     opts.rotate  = slant the axis labels (month labels are long, years are not)
     opts.maxBarW = bar-width ceiling (yearly has few bars, so they get wider) */
function renderTrend(p, bars, opts){
  const o=opts||{}, rotate=(o.rotate!==false), maxBarW=o.maxBarW||46;
  const series=bars, n=series.length, max=series.reduce((m,x)=>Math.max(m,Math.abs(x.value)),0);
  const barW=Math.max(12, Math.min(maxBarW, 560/n)), gap=Math.max(4, barW*0.32);
  const padL=10, padR=10, padTop=24, chartH=180, botH=46;
  const innerW=n*barW+(n-1)*gap, VW=padL+padR+innerW, VH=padTop+chartH+botH, baseY=padTop+chartH;
  dSvg.setAttribute('viewBox',`0 0 ${VW} ${VH}`); dSvg.setAttribute('width',VW); dSvg.setAttribute('height',VH);
  dSvg.innerHTML='';
  const color=panelColor(p);
  const axis=document.createElementNS(NS,'line'); axis.setAttribute('x1',padL); axis.setAttribute('y1',baseY);
  axis.setAttribute('x2',VW-padR); axis.setAttribute('y2',baseY); axis.setAttribute('class','daxis'); dSvg.appendChild(axis);
  series.forEach((x,i)=>{
    const px=padL+i*(barW+gap), bh=max>0?(Math.abs(x.value)/max)*chartH:0, yb=baseY-bh, cx=px+barW/2;
    const rect=document.createElementNS(NS,'rect'); rect.setAttribute('x',px); rect.setAttribute('y',yb);
    rect.setAttribute('width',barW); rect.setAttribute('height',Math.max(0,bh)); rect.setAttribute('rx',2);
    rect.setAttribute('fill',color); rect.setAttribute('fill-opacity', x.value<0?'.45':'.85'); dSvg.appendChild(rect);
    if(x.value!==0){ const vt=document.createElementNS(NS,'text'); vt.setAttribute('x',cx); vt.setAttribute('y',yb-5);
      vt.setAttribute('text-anchor','middle'); vt.setAttribute('class','dval'); vt.textContent=fmt(x.value); dSvg.appendChild(vt); }
    const mt=document.createElementNS(NS,'text'); mt.setAttribute('x',cx); mt.setAttribute('y',baseY+14);
    mt.setAttribute('text-anchor',rotate?'end':'middle'); mt.setAttribute('class','dmon');
    if(rotate) mt.setAttribute('transform',`rotate(-45 ${cx} ${baseY+14})`);
    mt.textContent=x.label; dSvg.appendChild(mt);
  });
  if(dHint) dHint.style.display='none';
}
function renderPanel(){
  if(!panel || !dEl || dEl.style.display==='none') return;
  const p=panel, rows=childrenOf(p);
  /* the yearly trend is deliberately window-independent: it always reads the full
     data range so you can see every year since the start next to each other. */
  const isYear=(p.view==='ytrend'), span=isYear?allTimeSpan():[curMiF,curMiT];
  const series=seriesOf(p, span[0], span[1]);
  const perMonthEl=document.getElementById('tMonthly'), perMonth=!!(perMonthEl && perMonthEl.checked);
  const yearBars=isYear ? bucketByYear(series).map(y=>({
        label:String(y.year), value: perMonth ? y.value/Math.max(1,y.months) : y.value })) : null;
  const tot=series.reduce((a,x)=>a+x.value,0)/(isYear?1:curDiv);
  if(dTitle) dTitle.textContent=p.name;
  if(dSub){
    if(isYear){
      const y0=Math.floor(span[0]/12), y1=Math.floor(span[1]/12);
      dSub.textContent=`${fmt(tot)} · ${y0} — ${y1} · all time`+(perMonth?' · bars are per-month averages':'');
    } else {
      dSub.textContent=`${fmt(tot)} · ${miLabel(curMiF)} — ${miLabel(curMiT)}`+(curDiv>1?' · per-month average':'');
    }
  }
  /* breadcrumb back to the entry we drilled in from */
  if(dCrumb){
    if(p.parent){ dCrumb.style.display=''; dCrumb.textContent=`\u2190 back to ${p.parent.name}`;
      dCrumb.onclick=ev=>{ ev.stopPropagation(); panel=p.parent; renderPanel(); }; }
    else { dCrumb.style.display='none'; dCrumb.onclick=null; }
  }
  /* view switches: Breakdown only when there is something to break down */
  if(dBreakBtn){ dBreakBtn.style.display=rows.length?'':'none'; dBreakBtn.classList.toggle('on',p.view==='break'); }
  if(dTrendBtn) dTrendBtn.classList.toggle('on',p.view==='trend');
  if(dYearBtn) dYearBtn.classList.toggle('on',isYear);
  /* exclusion moved here: only real entries (not the backbone hubs) can be excluded */
  if(dExcl){
    if(p.key){ dExcl.style.display=''; const off=deselected.has(p.key);
      dExcl.textContent=off?'Include in metrics':'Exclude from metrics';
      dExcl.classList.toggle('on',off); }
    else dExcl.style.display='none';
  }
  if(!rows.length && p.view==='break') p.view='trend';
  const hasTrend=series.some(x=>x.value!==0);
  if(p.view!=='break' && !hasTrend){
    dSvg.style.display='none';
    if(dHint) dHint.style.display='none';
    if(dMsg){ dMsg.style.display='';
      dMsg.textContent=isYear
        ? `No activity for “${p.name}” in any year on record.`
        : `No activity for “${p.name}” in ${miLabel(curMiF)} — ${miLabel(curMiT)}.`; }
    return;
  }
  if(dMsg) dMsg.style.display='none';
  dSvg.style.display='';
  if(p.view==='break')      renderBreakdown(p,rows);
  else if(isYear)           renderTrend(p, yearBars, {rotate:false, maxBarW:64});
  else                      renderTrend(p, series.map(x=>({label:miLabel(x.mi), value:x.value})), {rotate:true});
}
if(dBreakBtn) dBreakBtn.addEventListener('click',e=>{ e.stopPropagation(); if(panel){ panel.view='break'; renderPanel(); } });
if(dTrendBtn) dTrendBtn.addEventListener('click',e=>{ e.stopPropagation(); if(panel){ panel.view='trend'; renderPanel(); } });
if(dYearBtn) dYearBtn.addEventListener('click',e=>{ e.stopPropagation(); if(panel){ panel.view='ytrend'; renderPanel(); } });
if(dExcl) dExcl.addEventListener('click',e=>{ e.stopPropagation(); if(panel && panel.key) toggleEntry(panel.key); });
if(dClose) dClose.addEventListener('click',e=>{ e.stopPropagation(); closePanel(); });
if(dEl) dEl.addEventListener('click',e=>e.stopPropagation());
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && panel) closePanel(); });

/* label clipping: SVG font sizes are user units here, so the budget is in the
   same units as the layout margins. Keeps long category names from running over
   the diagram; the full name stays available as a <title> tooltip. */
function clipTxt(s,budget,cw){
  const str=String(s==null?'':s), max=Math.max(3,Math.floor(budget/cw));
  return str.length<=max ? str : str.slice(0,max-1)+'\u2026';
}

/* ---- render sankey ------------------------------------------------------- */
function render(res){
  svg.innerHTML=''; const {links, income}=res;
  const hidden=res.hidden||new Set(), ghosts=res.ghosts||[];
  if(!links.length || income<=0){ svg.style.display='none'; return; }   // all-deselected / empty income: hide the body gracefully (no divide-by-zero)
  svg.style.display='block';
  const nodes={};
  const ensure=n=>{ if(!nodes[n]) nodes[n]={name:n,in:0,out:0,outLinks:[],inLinks:[]}; return nodes[n]; };
  links.forEach(([s,t,v])=>{ const S=ensure(s),T=ensure(t),l={s,t,v,src:S,tgt:T}; S.out+=v; S.outLinks.push(l); T.in+=v; T.inLinks.push(l); });
  /* deselected entries: zero-value ghost connectors, added for layout + drawing
     ONLY (they never touch in/out sums, so they are excluded from node/flow sizing). */
  ghosts.forEach(g=>{ const S=ensure(g.s), T=ensure(g.t); ensure(g.node).entryKey=g.key;
    const l={s:g.s,t:g.t,v:0,src:S,tgt:T,ghost:true}; S.outLinks.push(l); T.inLinks.push(l); });
  const NL=Object.values(nodes); NL.forEach(n=> n.value=Math.max(n.in,n.out));
  const layerOf=n=> n.inLinks.length ? 1+Math.max(...n.inLinks.map(l=>layerOf(l.src))) : 0;
  NL.forEach(n=> n.layer=layerOf(n));
  const maxLayer=Math.max(...NL.map(n=>n.layer));
  /* window-independent Entry key for a node (null for the backbone hubs). Ghost
     stub nodes carry an explicit entryKey; real nodes derive it from position. */
  const entryKeyOf=n=>{ if(n.entryKey) return n.entryKey;
    const nm=n.name;
    if(nm==='Total income'||nm==='Expenses'||nm==='Savings') return null;
    if(n.outLinks.some(l=>l.tgt&&l.tgt.name==='Total income')) return 'IG|'+nm;   // income macro group
    if(n.inLinks.some(l=>l.src&&l.src.name==='Expenses')) return 'EG|'+nm;         // expense macro group
    if(n.layer===0) return 'I|'+nm;                                               // income leaf
    if(n.layer===maxLayer) return 'E|'+nm;                                        // expense leaf
    return null; };
  const band=n=> n.layer===0 ? n.outLinks[0].tgt.name : n.layer===maxLayer ? n.inLinks[0].src.name : n.name;
  const nodeColor=n=> n.layer<=1 ? INCOME : n.name==='Total income' ? BUDGET : n.name==='Expenses' ? EXPC : n.name==='Savings' ? GROUPCOL.Savings : (GROUPCOL[band(n)]||BUDGET);
  const linkColor=l=> l.tgt.layer<=2 ? INCOME : l.tgt.name==='Expenses' ? EXPC : l.tgt.name==='Savings' ? GROUPCOL.Savings : l.src.name==='Expenses' ? (GROUPCOL[l.tgt.name]||EXPC) : (GROUPCOL[l.src.name]||BUDGET);
  const scale=curScale;   // fixed px-per-€ so the diagram grows/shrinks with the period's absolute size
  const byLayer=[]; for(let i=0;i<=maxLayer;i++) byLayer[i]=NL.filter(n=>n.layer===i);
  byLayer.forEach(col=>col.sort((a,b)=>{ const r=ORDER.indexOf(band(a))-ORDER.indexOf(band(b)); return r!==0?r:b.value-a.value; }));
  const used=byLayer.map(col=>col.reduce((a,n)=>a+Math.max(n.value*scale,MINSLOT),0)+(col.length-1)*GAP);
  const contentH=Math.max(...used);
  const xOf=L=> LEFTM + L*((W-LEFTM-RIGHTM-NODEW)/maxLayer);
  byLayer.forEach((col,ci)=>{ let y=PAD_T+(contentH-used[ci])/2;
    col.forEach(n=>{ const key=entryKeyOf(n), isHidden=key&&hidden.has(key);
      const bar=isHidden?MINSLOT:n.value*scale, slot=Math.max(bar,MINSLOT); n.x=xOf(ci); n.h=bar; n.y=y+(slot-bar)/2; y+=slot+GAP; }); });
  const H=PAD_T+contentH+PAD_B; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  NL.forEach(n=>{ n.outLinks.sort((a,b)=>a.tgt.y-b.tgt.y); n.inLinks.sort((a,b)=>a.src.y-b.src.y);
    /* real links stack by their sized thickness; ghost stubs get a fixed thin
       band just below the node so they never shift the real ribbons. */
    let so=0, gso=0; n.outLinks.forEach(l=>{ if(l.ghost){ l.soff=n.h+2+gso; gso+=GHOST_TH+1; } else { l.soff=so; so+=l.v*scale; } });
    let io=0, gio=0; n.inLinks.forEach(l=>{ if(l.ghost){ l.ioff=n.h+2+gio; gio+=GHOST_TH+1; } else { l.ioff=io; io+=l.v*scale; } }); });
  const ribbon=l=>{ const th=l.ghost?GHOST_TH:l.v*scale, sx=l.src.x+NODEW, tx=l.tgt.x, sy=l.src.y+l.soff+th/2, ty=l.tgt.y+l.ioff+th/2, xm=(sx+tx)/2, t=th/2;
    return `M${sx},${sy-t} C${xm},${sy-t} ${xm},${ty-t} ${tx},${ty-t} L${tx},${ty+t} C${xm},${ty+t} ${xm},${sy+t} ${sx},${sy+t} Z`; };
  NL.forEach(n=> n.outLinks.forEach(l=>{ const p=document.createElementNS(NS,'path');
    p.setAttribute('d',ribbon(l)); p.setAttribute('fill',linkColor(l)); p.setAttribute('class', l.ghost?'link deselected':'link');
    if(!l.ghost){ p.addEventListener('mousemove',e=>showTip(e,`${l.s} → ${l.t}: ${fmt(l.v)}`)); p.addEventListener('mouseleave',hideTip); } svg.appendChild(p); }));
  NL.forEach(n=>{ const g=document.createElementNS(NS,'g'); g.setAttribute('class','node');
    const key=entryKeyOf(n), isHidden=key&&hidden.has(key);
    if(isHidden) g.classList.add('deselected');
    const r=document.createElementNS(NS,'rect'); r.setAttribute('x',n.x); r.setAttribute('y',n.y);
    r.setAttribute('width',NODEW); r.setAttribute('height',Math.max(1,n.h)); r.setAttribute('rx',2); r.setAttribute('fill',nodeColor(n));
    const isExpLeaf = !isHidden && n.layer===maxLayer && detailFor(n.name).length>0;
    /* click/tap on a node opens the Detail_Panel (nested breakdown Sankey +
       monthly trend + the include/exclude control). It no longer toggles the
       metrics directly: exclusion lives on the panel's button. */
    r.style.cursor='pointer';
    r.addEventListener('click',e=>{ e.stopPropagation(); openPanel(n.name, key); });
    /* hover detail (mini-Sankey for expense leaves, else tooltip) — selected nodes only */
    if(!isHidden){
      r.addEventListener('mousemove',e=>{ if(isExpLeaf){ showMini(e,n.name,nodeColor(n)); }
        else showTip(e,`<b>${n.name}</b> ${fmt(n.value)} <span style="color:#9aa6bd">(${(n.value/income*100).toFixed(0)}% of income)</span>`); });
      r.addEventListener('mouseleave',()=>{ hideTip(); scheduleHideMini(); });
    }
    g.appendChild(r);
    const label=document.createElementNS(NS,'text'); const mid=n.y+n.h/2;
    if(n.layer===0 || n.layer===maxLayer){
      const left=n.layer===0;
      label.setAttribute('x', left? n.x-8 : n.x+NODEW+8); label.setAttribute('text-anchor', left?'end':'start'); label.setAttribute('y',mid);
      /* clip the name to the margin it has to live in, so a long category never
         runs over the diagram (or off-canvas). Full name stays in the tooltip. */
      const valTxt = isHidden ? '' : ' '+fmt(n.value)+'  '+(n.value/income*100).toFixed(0)+'%';
      const budget = (left?LEFTM:RIGHTM) - 14 - valTxt.length*5.3;
      const a=document.createElementNS(NS,'tspan'); a.textContent=clipTxt(n.name,budget,6.0); label.append(a);
      if(valTxt){ const b=document.createElementNS(NS,'tspan'); b.setAttribute('class','nval'); b.textContent=valTxt; label.append(b); }
      const ttl=document.createElementNS(NS,'title'); ttl.textContent=n.name; label.appendChild(ttl);
    }else{
      label.setAttribute('x',n.x+NODEW/2); label.setAttribute('text-anchor','middle'); label.setAttribute('y',mid); label.setAttribute('class','mid');

      const colGap=(W-LEFTM-RIGHTM-NODEW)/maxLayer;
      if(isHidden){ label.textContent=clipTxt(n.name,colGap-8,5.9); }
      else { const pctTxt = income>0 && n.name!=='Total income' ? '  '+(n.value/income*100).toFixed(0)+'%' : '';
        const valTail=`  ${fmt(n.value)}${pctTxt}`;
        label.textContent = clipTxt(n.name, colGap-8-valTail.length*5.9, 5.9)+valTail; }
      const ttl=document.createElementNS(NS,'title'); ttl.textContent=n.name; label.appendChild(ttl);

    /* mobile/touch selection parity: enlarged transparent hit rect so the node

       the same openPanel(); inert on desktop via CSS so the bar's hover
       mini-Sankey/tooltip is untouched. */
    g.appendChild(label);
    {
      const HITMIN=55, hw=Math.max(NODEW,HITMIN), hh=Math.max(n.h,HITMIN), mc=n.y+n.h/2;
      const nh=document.createElementNS(NS,'rect');
      nh.setAttribute('x',n.x+NODEW/2-hw/2); nh.setAttribute('y',mc-hh/2);
      nh.setAttribute('width',hw); nh.setAttribute('height',hh); nh.setAttribute('class','nodehit');
      nh.addEventListener('click',e=>{ e.stopPropagation(); openPanel(n.name, key); });
      g.appendChild(nh);   // appended last => on top of bar + label, so the full 55u box opens the panel
    }
    svg.appendChild(g);
  });
}
function paintTotals(res){
  /* res is the post-applySelection result, so income / expGrp / sav already
     reflect the current Selection_State; the cards and the savings percentage
     update together on every build(), synchronously (well within the 1 s bound). */
  const {income,expGrp,sav}=res;
  const totExp=["Needs","Wants","Liberality","Taxes"].reduce((a,g)=>a+(expGrp[g]||0),0);
  /* Savings percentage via the guarded helper: savingsPercentage(selectedIncome,
     selectedExpenses) = (income - totExp)/income*100 (== sav/income*100, since
     outflow == totExp). Returns null when selected income <= 0 (e.g. all income
     deselected) -> show a non-numeric placeholder instead of a number/NaN. */
  const savPct=savingsPercentage(income,totExp);
  const savPctLabel = savPct===null ? '\u2014' : savPct.toFixed(1)+'% saved';
  const cards=[["Income",income,INCOME],["Expenses",totExp,EXPC]];
  /* keep the pre-feature card set (Savings shown when sav>0); also surface a
     Savings card when selected income <= 0 so the "—" placeholder is visible in
     the all-income-deselected case. */
  if(sav>0 || !(income>0)) cards.push(["Savings",sav,GROUPCOL.Savings]);
  const pct=v=> income>0 ? (v/income*100).toFixed(0)+'% of income' : '';   // unchanged: per-income "% of income" for Income/Expenses cards
  document.getElementById('totals').innerHTML=cards.map(([lab,v,c],i)=>{
    const sub = lab==='Savings' ? savPctLabel : (i===0?'':pct(v));
    return `<div class="tot"><div class="lab">${lab}</div><div class="val" style="color:${c}">${fmt(v)}</div><div class="pct">${sub}</div></div>`;
  }).join('');
}

/* ---- draggable month-range slider (with movable window) ------------------ */
const modeEl=document.getElementById('mode'), yearEl=document.getElementById('year'), monthEl=document.getElementById('month'),
      monthlyEl=document.getElementById('tMonthly'), t12El=document.getElementById('t12'),
      dualEl=document.getElementById('dual'),
      rFill=document.getElementById('rFill'), hLo=document.getElementById('hLo'), hHi=document.getElementById('hHi'),
      rLoL=document.getElementById('rLo'), rHiL=document.getElementById('rHi');
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const maxIdx=()=> META.maxMi-META.minMi;
let loIdx=0, hiIdx=0, drag=null, dragStart=0, dragLo=0, dragHi=0;
function updateSliderUI(){
  const N=maxIdx()||1, lp=loIdx/N*100, hp=hiIdx/N*100;
  hLo.style.left=lp+'%'; hHi.style.left=hp+'%'; rFill.style.left=lp+'%'; rFill.style.width=(hp-lp)+'%';
  rLoL.textContent=miLabel(META.minMi+loIdx); rHiL.textContent=miLabel(META.minMi+hiIdx);
}
function setSlider(lo,hi){ const N=maxIdx(); loIdx=Math.max(0,Math.min(N,Math.round(lo))); hiIdx=Math.max(0,Math.min(N,Math.round(hi)));
  if(loIdx>hiIdx)[loIdx,hiIdx]=[hiIdx,loIdx]; updateSliderUI(); }
function idxFromX(clientX){ const r=dualEl.getBoundingClientRect(), N=maxIdx(); let f=(clientX-r.left)/r.width; f=Math.max(0,Math.min(1,f)); return Math.round(f*N); }
/* one shared drag pipeline for both pointer and touch input, so the range bar
   behaves identically whether dragged with a mouse or a finger */
function beginDrag(mode,clientX){ drag=mode; if(mode==='band'){ dragStart=idxFromX(clientX); dragLo=loIdx; dragHi=hiIdx; } }
function moveDrag(clientX){
  if(!drag) return; const idx=idxFromX(clientX), N=maxIdx();   // idxFromX already clamps to [0,N]
  if(drag==='lo') loIdx=Math.min(idx,hiIdx);
  else if(drag==='hi') hiIdx=Math.max(idx,loIdx);
  else { const w=dragHi-dragLo; let nl=dragLo+(idx-dragStart), nh=nl+w; if(nl<0){nl=0;nh=w;} if(nh>N){nh=N;nl=N-w;} loIdx=nl; hiIdx=nh; }
  updateSliderUI(); build();
}
function endDrag(){ drag=null; }
/* Pointer path: capture the pointer on the element that was pressed, so the drag keeps
   receiving moves even when the finger leaves the 26px-tall bar (which is what broke the
   drag in landscape, where the bar is a small band in a wide viewport and the browser
   reclaimed the gesture for panning). Captured moves still bubble to window. */
function onDown(mode){
  return e=>{
    beginDrag(mode, e.clientX);
    if(e.pointerId!=null && e.currentTarget.setPointerCapture){
      try{ e.currentTarget.setPointerCapture(e.pointerId); }catch(_){}
    }
    e.preventDefault();
  };
}
hLo.addEventListener('pointerdown',onDown('lo'));
hHi.addEventListener('pointerdown',onDown('hi'));
rFill.addEventListener('pointerdown',onDown('band'));
window.addEventListener('pointermove',e=>{ if(drag){ moveDrag(e.clientX); e.preventDefault(); } });
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
/* touch fallback ONLY where pointer events are unavailable: running both pipelines meant
   touchstart's preventDefault could cancel the in-flight pointer sequence and kill the drag */
if(!window.PointerEvent){
  const tx=e=> e.touches && e.touches[0] ? e.touches[0].clientX : (e.changedTouches&&e.changedTouches[0]?e.changedTouches[0].clientX:0);
  hLo.addEventListener('touchstart',e=>{ beginDrag('lo',tx(e)); e.preventDefault(); },{passive:false});
  hHi.addEventListener('touchstart',e=>{ beginDrag('hi',tx(e)); e.preventDefault(); },{passive:false});
  rFill.addEventListener('touchstart',e=>{ beginDrag('band',tx(e)); e.preventDefault(); },{passive:false});
  window.addEventListener('touchmove',e=>{ if(drag){ moveDrag(tx(e)); e.preventDefault(); } },{passive:false});
  window.addEventListener('touchend',endDrag);
  window.addEventListener('touchcancel',endDrag);
}
function presetRange(){
  const mode=modeEl.value, y=+yearEl.value, m=+monthEl.value;
  if(mode==='all') return [META.minMi, META.maxMi];
  if(mode==='year') return [y*12, Math.min(META.maxMi, y*12+11)];
  const mi=y*12+(m-1);
  if(mode==='month') return [mi, mi];
  return [Math.max(META.minMi, mi-11), mi];
}
function applyPreset(){ const [f,t]=presetRange(); setSlider(f-META.minMi, t-META.minMi); build(); }

/* ---- net worth: headline cards + collapsible assets/liabilities table -------
   The table lists accounts and their values, grouped by category. Categories are
   collapsed by default; clicking one reveals its account / asset-class rows.
   `nwOpen` lives at module scope so the expanded set survives a re-render (e.g.
   toggling "values in K"). */
let nwOpen=new Set();
function buildNetWorth(){
  const holds=NWHOLD; const wrap=document.getElementById('nwwrap'); const cardsEl=document.getElementById('nwcards');
  if(!holds.length){ if(cardsEl) cardsEl.innerHTML=''; wrap.innerHTML=''; return; }
  const cur=META.allMaxMi;
  const cumAt=(h,mi)=>{ let s=0; const f=h.flows; for(const k in f){ if(+k<=mi) s+=f[k]; } return s; };
  const rows=holds.map(h=>({vary:h.vary,acd:h.acd,acct:h.acct,cat:h.cat, v:cumAt(h,cur)}))
                  .filter(r=> Math.abs(r.v)>0.5);
  const cap=s=> s ? s.charAt(0)+s.slice(1).toLowerCase() : s;
  const vcell=v=>`<td class="val ${v<0?'neg':''}">${v<0?'('+fmt(-v)+')':fmt(v)}</td>`;
  const sumV=list=>list.reduce((a,r)=>a+r.v,0);
  const money=v=>(v<0?'\u2212':'')+fmt(Math.abs(v));

  // headline cards: net worth + total assets only, side by side and compact.
  // Liabilities = only the LIABILITIES category (not every negative row); assets = the rest.
  const gTot=sumV(rows);
  const liab=sumV(rows.filter(r=>r.cat==="LIABILITIES"));
  const assets=gTot-liab;
  cardsEl.innerHTML=
    `<div class="nwcard net"><div class="lab">Net worth</div><div class="big">${money(gTot)}</div></div>`+
    `<div class="nwcard assets"><div class="lab">Total assets</div><div class="big">${money(assets)}</div></div>`;

  // group by category, ordered by absolute subtotal (biggest positions first); the
  // account rows inside a category are ordered by value (high -> low) and are only
  // rendered when that category is open.
  const catMap={}; rows.forEach(r=>{ (catMap[r.cat]=catMap[r.cat]||[]).push(r); });
  const catOrder=Object.keys(catMap).sort((a,b)=>Math.abs(sumV(catMap[b]))-Math.abs(sumV(catMap[a])));
  const esc=s=> String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* two columns only (name | value) so the table fits a phone screen without any
     sideways scroll; the asset-class detail rides under the account name. */
  const allOpen=catOrder.every(c=>nwOpen.has(c)), noneOpen=catOrder.every(c=>!nwOpen.has(c));
  let h=`<div class="nwtools">`+
    `<button type="button" data-nwall="open"${allOpen?' disabled':''}>Expand all</button>`+
    `<button type="button" data-nwall="close"${noneOpen?' disabled':''}>Collapse all</button></div>`+
    `<table class="nw"><colgroup><col><col class="cval"></colgroup><thead><tr>`+
    `<th class="grp">Category / account</th><th>Value</th></tr></thead><tbody>`;
  catOrder.forEach(cat=>{
    const cl=catMap[cat].slice().sort((a,b)=>b.v-a.v);
    const open=nwOpen.has(cat);
    h+=`<tr class="sub cgroup" data-cat="${esc(cat)}" tabindex="0" role="button" aria-expanded="${open}">`+
       `<td class="t"><span class="tw">${open?'\u25BE':'\u25B8'}</span>${cap(cat)} `+
       `<span class="cnt">(${cl.length})</span></td>`+vcell(sumV(cl))+`</tr>`;
    if(open) cl.forEach(r=>{
      const acd=r.acd && r.acd!=='\u2014' && norm(r.acd)!==norm(r.acct) ? `<span class="acd">${esc(cap(r.acd))}</span>` : '';
      h+=`<tr class="kid"><td class="t2">${esc(cap(r.acct))}${acd}</td>`+vcell(r.v)+`</tr>`;
    });
  });
  h+=`</tbody></table>`;
  wrap.innerHTML=h;
  // expand / collapse a category (click or keyboard), then re-render off nwOpen
  const toggleCat=cat=>{ if(nwOpen.has(cat)) nwOpen.delete(cat); else nwOpen.add(cat); buildNetWorth(); };
  wrap.querySelectorAll('tr.cgroup').forEach(tr=>{
    const cat=tr.getAttribute('data-cat');
    tr.addEventListener('click',()=>toggleCat(cat));
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleCat(cat); } });
  });
  // expand all / collapse all categories at once
  wrap.querySelectorAll('button[data-nwall]').forEach(b=>b.addEventListener('click',()=>{
    nwOpen = b.getAttribute('data-nwall')==='open' ? new Set(catOrder) : new Set();
    buildNetWorth();
  }));
}

/* ---- main build ---------------------------------------------------------- */
function build(){
  curMiF=META.minMi+loIdx; curMiT=META.minMi+hiIdx;
  const raw=computeLinks(curMiF,curMiT); const monthly=monthlyEl.checked; curDiv=monthly?raw.months:1;
  /* filter the diagram by the current Selection_State before sizing/painting, so
     render() and paintTotals() consume the selection-adjusted result; res.hidden
     drives the greyed stubs and res.ghosts their dimmed connectors. */
  const res=applySelection(raw, deselected);
  res.ghosts=ghostLinks(raw, res);
  curScale = TARGET_H / scaleReferenceFor(modeEl.value, monthly, META.refs);   // per-Comparison_Mode reference: consistent within a mode, adaptive across modes
  let plabel=`${miLabel(curMiF)} — ${miLabel(curMiT)}`;
  if(monthly && res.months>0){
    res.links=res.links.map(([s,t,v])=>[s,t,v/res.months]); res.income/=res.months; res.sav/=res.months;
    for(const g in res.expGrp) res.expGrp[g]/=res.months;
    plabel += ` · per-month average over ${res.months} month${res.months>1?'s':''}`;
  }
  document.getElementById('periodLabel').textContent=plabel;
  paintTotals(res); render(res); syncExclUI();
  /* If the Detail_Panel is open, refresh it against the new window/mode so ANY
     Period_Selector change (Quick-set dropdown, year/month pickers, range-bar
     drag/resize, per-month toggle) follows through to the overlay WITHOUT tearing
     down the Sankey or the Selection_State. renderPanel() reads the freshly
     updated curMiF/curMiT and no-ops when the panel is closed. */
  renderPanel();
}
/* excluded-entries pill: shows how many entries are out of the metrics and offers
   a one-tap way back in (the only place exclusions were visible before was the
   greyed stubs on the diagram itself) */
function syncExclUI(){
  const box=document.getElementById('exclBox'), cnt=document.getElementById('exclCount');
  if(!box) return;
  if(deselected.size){ box.style.display='inline-flex';
    if(cnt) cnt.textContent=`${deselected.size} excluded`; }
  else box.style.display='none';
}

/* ---- data cache (stale-while-revalidate) --------------------------------- */
/* Stores the raw CSV only, in the visitor's own browser (localStorage). Nothing
   is transmitted anywhere except the existing public Google Sheets CSV endpoint. */
const SheetCache={
  KEY:"finance-sankey-cache-v1",
  MAX_AGE_MS:24*60*60*1000,
  available(){ try{ const k="__fs_probe__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } },
  read(){ try{ const raw=localStorage.getItem(this.KEY); if(!raw) return {ok:false};
      const entry=JSON.parse(raw);
      if(!entry || typeof entry.csv!=='string' || typeof entry.retrievedAt!=='number') return {ok:false};
      return {ok:true, entry}; }catch(e){ return {ok:false}; } },
  write(csv,retrievedAt){ try{ localStorage.setItem(this.KEY, JSON.stringify({v:1,csv,retrievedAt})); return true; }catch(e){ return false; } },
  isFresh(entry,now){ return !!entry && typeof entry.retrievedAt==='number' && (now-entry.retrievedAt) <= this.MAX_AGE_MS; },
  differs(a,b){ return String(a) !== String(b); }
};

/* ---- fetch with bounded retry (<=3) + 10s per-attempt timeout ------------ */
async function fetchSheet(){
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{
      let signal, to;
      if(typeof AbortController==='function'){ const ctrl=new AbortController(); signal=ctrl.signal; to=setTimeout(()=>ctrl.abort(),10000); }
      const resp=await fetch(CSV_URL, signal?{cache:"no-store",signal}:{cache:"no-store"});
      if(to) clearTimeout(to);
      if(!resp.ok) throw new Error("HTTP "+resp.status);
      return await resp.text();
    }catch(e){ lastErr=e; if(attempt<2) await new Promise(r=>setTimeout(r,400*(attempt+1))); }
  }
  throw lastErr || new Error("fetch failed");
}

/* ---- rendering / control wiring ------------------------------------------ */
const statusEl=document.getElementById('status'), badgeEl=document.getElementById('dataBadge');
let controlsReady=false;
function syncYearOptions(){
  const prev=yearEl.value; yearEl.innerHTML='';
  META.years.forEach(y=>{ const o=document.createElement('option'); o.value=y; o.textContent=y; yearEl.appendChild(o); });
  const maxYear=Math.floor(META.maxMi/12);
  yearEl.value=(prev && META.years.indexOf(+prev)>=0) ? prev : maxYear;
}
function initControlsOnce(){
  if(controlsReady) return;
  MONTHS.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i+1; o.textContent=m; monthEl.appendChild(o); });
  monthEl.value=META.maxMi%12+1;
  /* open on the current (latest) month, not on the trailing window */
  modeEl.value='month';
  t12El.checked=false;
  setSlider(maxIdx(), maxIdx());
  [yearEl,monthEl].forEach(el=>el.addEventListener('change',applyPreset));
  /* quick-set and the trailing-12 flag are two views of the same Comparison_Mode,
     so each keeps the other in sync */
  modeEl.addEventListener('change',()=>{ t12El.checked=(modeEl.value==='trailing'); applyPreset(); });
  t12El.addEventListener('change',()=>{ modeEl.value=t12El.checked?'trailing':'month'; applyPreset(); });
  monthlyEl.addEventListener('change',build);
  document.getElementById('tK').addEventListener('change',e=>{ showK=e.target.checked; build(); buildNetWorth(); });
  const er=document.getElementById('exclReset');
  if(er) er.addEventListener('click',e=>{ e.stopPropagation(); deselected.clear(); build(); });
  document.getElementById('controls').style.display='';
  document.getElementById('rangeBox').style.display='';
  document.getElementById('nwhead').style.display='';
  controlsReady=true;
}
function renderAll(){ build(); requestAnimationFrame(()=>buildNetWorth()); }   // Sankey first, table next frame
function applyData(csv){
  aggregate(parseCSV(csv));
  if(!DATA.length) throw new Error("No usable rows (check the sheet is shared 'anyone with the link → Viewer' and named DB).");
  syncYearOptions();
  initControlsOnce();
  const N=maxIdx();                            // keep the user's window on a refresh, clamp to new bounds
  if(hiIdx>N) hiIdx=N; if(loIdx>hiIdx) loIdx=Math.max(0,hiIdx); updateSliderUI();
  statusEl.style.display='none'; hideSkeleton();
  renderAll();
}
function showBadge(retrievedAt,refreshing){
  if(!badgeEl) return;
  const d=new Date(retrievedAt); const t=(retrievedAt && !isNaN(d.getTime()))?` (from ${d.toLocaleString()})`:'';
  badgeEl.textContent=`Showing last loaded data${t}`+(refreshing?' — refreshing…':'');
  badgeEl.style.display='';
}
function clearBadge(){ if(badgeEl) badgeEl.style.display='none'; }
function hideSkeleton(){ const s=document.getElementById('skeleton'); if(s) s.style.display='none'; }
function showError(msg,timedOut){
  hideSkeleton();
  statusEl.style.display=''; statusEl.className='status err';
  statusEl.innerHTML = timedOut
    ? `Loading timed out.<br>Check your connection and that the Google Sheet is shared as <b>“Anyone with the link → Viewer”</b> and has a tab named <b>DB</b>.`
    : `Could not load the sheet: ${msg}<br>Make sure the Google Sheet is shared as <b>“Anyone with the link → Viewer”</b> and has a tab named <b>DB</b>.`;
}

/* ---- boot: render cached data first, refresh live in the background ------ */
function boot(){
  const cached=SheetCache.read(), now=Date.now();
  let renderedFromCache=false, settled=false;
  if(cached.ok && SheetCache.isFresh(cached.entry,now)){
    try{ applyData(cached.entry.csv); renderedFromCache=true; showBadge(cached.entry.retrievedAt,true); }catch(e){ renderedFromCache=false; }
  }
  const overall=setTimeout(()=>{ if(!settled && !renderedFromCache) showError('',true); },30000);
  fetchSheet().then(csv=>{
    settled=true; clearTimeout(overall);
    if(renderedFromCache){
      if(SheetCache.differs(cached.entry.csv,csv)){ SheetCache.write(csv,Date.now()); applyData(csv); }
      clearBadge();                            // live data confirmed current
    }else{
      applyData(csv); SheetCache.write(csv,Date.now()); clearBadge();
    }
  }).catch(err=>{
    settled=true; clearTimeout(overall);
    if(renderedFromCache){ showBadge(cached.entry.retrievedAt,false); return; }        // keep cached data on screen
    if(cached.ok){ try{ applyData(cached.entry.csv); showBadge(cached.entry.retrievedAt,false); return; }catch(e){} }  // fall back to stale cache
    showError(err && err.message ? err.message : 'load failed');
  });
}
/* tap/click away closes the hover preview and the detail panel (the panel itself
   stops propagation, and node clicks do too, so neither closes on its own click) */
document.addEventListener('click',()=>{ hideMini(); if(panel) closePanel(); });
boot();

/* ---- test-only export shim ------------------------------------------------
   Exposes the pure helpers to the Node test harness (fast-check).
   Guarded so it is completely inert in the browser: there is no `module`
   global on the shipped single-file page, so this block never runs and adds
   no external dependency or runtime cost. The export list grows as each pure
   helper (SheetCache, thickness, idxFromClientX, isMobile, ...) lands in a
   later task; only helpers that already exist are referenced here. */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseCSV, aggregate, computeLinks, applySelection, detailFor, SheetCache, fetchSheet, isMobile, MOBILE_BP, scaleReferenceFor, savingsPercentage, monthlySeries };
}
