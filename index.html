<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Personal Finance — Sankey</title>
<style>
  :root{
    --bg:#0f1420; --panel:#151b2b; --ink:#e7ecf5; --muted:#9aa6bd;
    --income:#3aa86a; --budget:#586a86;
    --needs:#5b8fd0; --wants:#e08a3c; --liberality:#b57fd6; --taxes:#c85c5c; --savings:#e7c14a;
    --grid:#243049; --exp:#d98a4a;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--bg); color:var(--ink);
       font-family:"Amazon Ember","Segoe UI",Calibri,Arial,sans-serif;}
  header{padding:16px 26px 4px;}
  h1{margin:0; font-size:19px; font-weight:700;}
  h2{margin:0; font-size:14px; font-weight:700;}
  .sub{color:var(--muted); font-size:12.5px; margin-top:3px;}
  .controls{margin:12px 26px 0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; font-size:12.5px;}
  select{background:var(--panel); color:var(--ink); border:1px solid var(--grid); border-radius:7px; padding:5px 8px;}
  .controls label{color:var(--muted); cursor:pointer;}
  .totals{display:flex; gap:12px; margin:12px 26px 0; flex-wrap:wrap;}
  .tot{background:var(--panel); border:1px solid var(--grid); border-radius:10px; padding:8px 12px; min-width:96px;}
  .tot .lab{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .tot .val{font-size:18px; font-weight:700; margin-top:2px;}
  .tot .pct{font-size:11px; color:var(--muted); margin-top:1px;}
  .period{margin:8px 26px 0; color:var(--muted); font-size:12px;}
  .status{margin:16px 26px; color:var(--muted); font-size:13px;}
  .status.err{color:#e58a8a;}
  .wrap{padding:6px 20px 8px; max-width:980px;}
  svg{width:100%; height:auto; display:block; overflow:visible;}
  .node text{fill:var(--ink); font-size:11px; dominant-baseline:middle;}
  .node .nval{fill:var(--muted); font-size:10px;}
  text.mid{fill:#fff; font-weight:600; font-size:10.5px; paint-order:stroke; stroke:var(--bg); stroke-width:3.4px; stroke-linejoin:round;}
  .link{fill-opacity:.36; transition:fill-opacity .15s;}
  .link:hover{fill-opacity:.7;}
  .tip{position:fixed; pointer-events:none; background:#0b0f18; color:#fff; border:1px solid var(--grid);
       border-radius:6px; padding:6px 9px; font-size:12px; opacity:0; transition:opacity .1s; z-index:30; white-space:nowrap;}
  #mini{position:fixed; pointer-events:none; background:#0b0f18; border:1px solid var(--grid); border-radius:9px;
        padding:8px 10px; opacity:0; transition:opacity .1s; z-index:20; box-shadow:0 8px 24px rgba(0,0,0,.55);}
  #mini .mt{font-size:11px; color:#fff; font-weight:700; margin-bottom:4px;}
  #mini text.mtx{fill:var(--ink); font-size:9.5px; dominant-baseline:middle;}
  /* draggable month-range slider */
  #rangeBox{margin:10px 26px 0; max-width:640px;}
  .rangelabels{display:flex; justify-content:space-between; font-size:12px; color:var(--ink); margin-bottom:3px;}
  .dual{position:relative; height:26px; user-select:none; touch-action:none;}
  .dual .track{position:absolute; top:11px; left:0; right:0; height:4px; background:var(--grid); border-radius:3px; z-index:1;}
  .dual .fill{position:absolute; top:9px; height:8px; background:var(--income); opacity:.5; border-radius:4px; z-index:2; cursor:grab;}
  .dual .handle{position:absolute; top:4px; width:16px; height:16px; margin-left:-8px; border-radius:50%;
     background:#fff; border:2px solid var(--income); z-index:3; cursor:grab;}
  .hint{margin:4px 26px 0; color:var(--muted); font-size:11px;}
  /* net worth */
  .nwhead{margin:18px 26px 0;}
  .nwsub{color:var(--muted); font-size:12px; margin-top:2px;}
  .nwwrap{margin:8px 26px 40px; overflow-x:auto;}
  table.nw{border-collapse:collapse; font-size:12px;}
  .nw th,.nw td{border:1px solid var(--grid); padding:4px 10px; text-align:right; white-space:nowrap;}
  .nw th{background:#1b2333; color:var(--ink); font-weight:600;}
  .nw th.grp{text-align:left;}
  .nw td.t{text-align:left; color:var(--ink);}
  .nw td.mut{text-align:left; color:var(--muted);}
  .nw tr.sub td{background:#12192a; font-weight:700;}
  .nw tr.tot td{background:#1b2333; font-weight:700; border-top:2px solid var(--grid);}
  .nw .dp{font-size:10.5px; opacity:.8; margin-left:4px;}
  .nw .val{color:var(--ink);}
  .nw .neg{color:#e58a8a;} .nw .pos{color:#7fd0a3;}
</style>
</head>
<body>
<header>
  <h1>Personal Finance — money flow</h1>
</header>

<div class="controls" id="controls" style="display:none">
  <label>Quick set
    <select id="mode">
      <option value="trailing">Trailing 12 months</option>
      <option value="month">Single month</option>
      <option value="year">Full year</option>
      <option value="all">All time</option>
    </select>
  </label>
  <select id="year"></select>
  <select id="month"></select>
  <label><input type="checkbox" id="tMonthly"> per month (avg)</label>
  <label><input type="checkbox" id="tK"> values in K</label>
</div>

<div id="rangeBox" style="display:none">
  <div class="rangelabels"><span id="rLo"></span><span id="rHi"></span></div>
  <div class="dual" id="dual">
    <div class="track"></div>
    <div class="fill" id="rFill"></div>
    <div class="handle" id="hLo"></div>
    <div class="handle" id="hHi"></div>
  </div>
  <div class="hint">Drag the ends to resize the window, or drag the middle band to shift the whole period.</div>
</div>

<div class="status" id="status">Loading data from Google Sheets…</div>
<div class="period" id="periodLabel"></div>
<div class="totals" id="totals"></div>
<div class="wrap"><svg id="sankey" viewBox="0 0 900 520" preserveAspectRatio="xMidYMid meet"></svg></div>

<div class="nwhead" id="nwhead" style="display:none">
  <h2>Net worth</h2>
</div>
<div class="nwwrap" id="nwwrap"></div>

<div class="tip" id="tip"></div>
<div id="mini"><div class="mt" id="miniTitle"></div><svg id="miniSvg"></svg></div>

<script>
/* ---- data source --------------------------------------------------------- */
const SHEET_ID="1SnEHP7oBD9Fo38yQ0OvlhYESiidmY98f9fqfHNhDLnc";
const SHEET_NAME="DB";
const CSV_URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;

const INCGRP={WORKINCOME:"Work income",NONWORKINCOME:"Non-work income"};
const EXPGRP={NEEDS:"Needs",WANTS:"Wants",LIBERALITY:"Liberality"};
const norm=s=> s==null ? "" : String(s).trim().toUpperCase();

let DATA=[], DETAIL=[], NWHOLD=[], META={years:[],minMi:0,maxMi:0,allMinMi:0,allMaxMi:0,refMonth:1,refWindow:1};

/* minimal RFC4180 CSV parser */
function parseCSV(text){
  const rows=[]; let row=[], field="", i=0, q=false;
  while(i<text.length){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){field+='"'; i++;} else q=false; } else field+=c; }
    else{
      if(c==='"') q=true;
      else if(c===','){ row.push(field); field=""; }
      else if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=""; }
      else if(c==='\r'){}
      else field+=c;
    }
    i++;
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows;
}

function aggregate(rows){
  const head=rows[0].map(norm), ix=n=>head.indexOf(n);
  const cY=ix("YEAR"),cM=ix("MONTH"),cV=ix("VALUE"),cL=ix("LABEL"),cD=ix("DETAIL"),
        cACD=ix("ASSETCLASSDETAILS"),cT=ix("TYPE"),cC1=ix("CATEGORY1"),
        cACC=ix("ACCOUNT"),cVAR=ix("VARIABLE"),cC3=ix("CATEGORY3");
  const agg=new Map(), det=new Map(), years=new Set();
  const HOLD=new Map(), incByMi={}; let allMin=Infinity, allMax=-Infinity;
  for(let r=1;r<rows.length;r++){
    const row=rows[r]; if(!row || row[cY]===undefined || row[cY]==="") continue;
    const year=parseInt(row[cY],10), month=parseInt(row[cM],10); if(!year||!month) continue;
    const val=parseFloat(row[cV])||0;
    const label=row[cL], detail=row[cD], typ=norm(row[cT]), c1=norm(row[cC1]);
    const mi=year*12+(month-1); years.add(year);
    if(mi<allMin) allMin=mi; if(mi>allMax) allMax=mi;
    /* net worth holding — every row contributes to a balance (incl. appreciation/transfers/liabilities) */
    const vary=norm(cVAR>=0?row[cVAR]:"")||"OTHER";
    const acd=norm(cACD>=0?row[cACD]:"")||"—";
    const acct=norm(cACC>=0?row[cACC]:"")||"—";
    const cat=norm(cC3>=0?row[cC3]:"")||"—";
    const hk=vary+"|"+acd+"|"+acct+"|"+cat;
    let h=HOLD.get(hk); if(!h){ h={vary,acd,acct,cat,flows:{},tin:0}; HOLD.set(hk,h); }
    h.flows[mi]=(h.flows[mi]||0)+val;
    if(typ==="TRANSFER" && vary==="VARIABLE") h.tin+=val;   // capital transferred into the investing account
    /* cash flow (income/expenses only) */
    let kind,group,leaf;
    if(typ==="INCOME"){ kind="I"; group=INCGRP[c1]||"Other income"; leaf=norm(detail); incByMi[mi]=(incByMi[mi]||0)+val; }
    else if(typ==="EXPENSES"){ kind="E"; group=EXPGRP[c1]||"Other"; leaf=norm(label); }
    else if(typ==="TAXES"){ if(norm(detail)==="APPRECTAXES") continue; kind="E"; group="Taxes"; leaf=norm(label); }
    else continue;   // TRANSFER / APPRECIATION excluded from cash flow (still in net worth)
    if(!leaf) continue;
    agg.set(mi+"|"+kind+"|"+group+"|"+leaf,(agg.get(mi+"|"+kind+"|"+group+"|"+leaf)||0)+val);
    if(kind==="E"){ const dn=(detail!=null && String(detail).trim()!=="") ? String(detail).trim() : leaf;
      det.set(mi+"|"+leaf+"|"+dn,(det.get(mi+"|"+leaf+"|"+dn)||0)+(-val)); }
  }
  DATA=[...agg.entries()].map(([k,v])=>{ const [mi,kind,group,leaf]=k.split("|"); return [+mi,kind,group,leaf,Math.round(v)]; });
  DETAIL=[...det.entries()].map(([k,v])=>{ const [mi,leaf,dn]=k.split("|"); return [+mi,leaf,dn,Math.round(v)]; });
  NWHOLD=[...HOLD.values()];
  const mis=DATA.map(r=>r[0]);
  /* scale references (income-based) so node heights are comparable across periods */
  let refMonth=0; for(const k in incByMi) refMonth=Math.max(refMonth, incByMi[k]);
  let refWindow=0; const im=Object.keys(incByMi).map(Number);
  if(im.length){ const lo=Math.min(...im), hi=Math.max(...im);
    for(let end=lo; end<=hi; end++){ let s=0; for(let m=end-11;m<=end;m++) s+=incByMi[m]||0; refWindow=Math.max(refWindow,s); } }
  META={years:[...years].sort((a,b)=>a-b), minMi:Math.min(...mis), maxMi:Math.max(...mis),
        allMinMi:allMin, allMaxMi:allMax, refMonth:refMonth||1, refWindow:refWindow||1};
}

/* ---- layout config ------------------------------------------------------- */
const W=900, PAD_T=20, PAD_B=20, NODEW=13, GAP=6, MINSLOT=22, TARGET_H=360;
const LEFTM=140, RIGHTM=185;
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const GROUPCOL={Needs:cssv('--needs'),Wants:cssv('--wants'),Liberality:cssv('--liberality'),Taxes:cssv('--taxes'),Savings:cssv('--savings')};
const INCOME=cssv('--income'), BUDGET=cssv('--budget'), EXPC=cssv('--exp');
const ORDER=["Work income","Non-work income","Total income","Expenses","Needs","Wants","Liberality","Taxes","Savings"];
const svg=document.getElementById('sankey'), NS="http://www.w3.org/2000/svg", tip=document.getElementById('tip');
let showK=false, curMiF=0, curMiT=0, curDiv=1, curScale=1;
const fmt=v=> showK ? (v/1000).toLocaleString(undefined,{maximumFractionDigits:1})+"K" : Math.round(v).toLocaleString();
function showTip(e,html){ tip.innerHTML=html; tip.style.opacity=1; tip.style.left=(e.clientX+12)+'px'; tip.style.top=(e.clientY+12)+'px'; }
function hideTip(){ tip.style.opacity=0; }
const miLabel=mi=> ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][((mi%12)+12)%12]+' '+Math.floor(mi/12);

function computeLinks(miF,miT){
  const incLeaf={}, incGrpOf={}, expLeaf={}, expGrpOf={}, monthsSeen={};
  DATA.forEach(([mi,kind,grp,leaf,val])=>{
    if(mi<miF||mi>miT) return; monthsSeen[mi]=1;
    if(kind==='I'){ incLeaf[leaf]=(incLeaf[leaf]||0)+val; incGrpOf[leaf]=grp; }
    else { expLeaf[leaf]=(expLeaf[leaf]||0)+(-val); expGrpOf[leaf]=grp; }
  });
  const incGrp={}, expGrp={}; let income=0, outflow=0; const links=[];
  for(const leaf in incLeaf){ const v=incLeaf[leaf]; if(v>0){ const g=incGrpOf[leaf];
    links.push([leaf,g,v]); incGrp[g]=(incGrp[g]||0)+v; income+=v; } }
  for(const g in incGrp) links.push([g,'Total income',incGrp[g]]);
  const eb=[];
  for(const leaf in expLeaf){ const v=expLeaf[leaf]; if(v>0){ const g=expGrpOf[leaf];
    expGrp[g]=(expGrp[g]||0)+v; outflow+=v; eb.push([g,leaf,v]); } }
  // total income -> one merged Expenses node -> macro groups -> leaves
  if(outflow>0) links.push(['Total income','Expenses',outflow]);
  for(const g in expGrp) links.push(['Expenses',g,expGrp[g]]);
  eb.forEach(x=>links.push(x));
  const sav=income-outflow; if(sav>0) links.push(['Total income','Savings',sav]);
  return {links, income, expGrp, sav, months:Object.keys(monthsSeen).length||1};
}
function detailFor(leaf){
  const d={};
  DETAIL.forEach(([mi,lf,dn,v])=>{ if(lf===leaf && mi>=curMiF && mi<=curMiT) d[dn]=(d[dn]||0)+v; });
  return Object.entries(d).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
}

/* ---- floating mini-sankey (category -> details) -------------------------- */
const miniEl=document.getElementById('mini'), miniSvg=document.getElementById('miniSvg'), miniTitle=document.getElementById('miniTitle');
let miniLeaf=null, miniH=0;
function renderMini(leaf,color){
  let parts=detailFor(leaf).map(([dn,v])=>[dn, v/curDiv]);
  const CAP=12;
  if(parts.length>CAP){ const head=parts.slice(0,CAP); head.push(['Other', parts.slice(CAP).reduce((a,[,v])=>a+v,0)]); parts=head; }
  const total=parts.reduce((a,[,v])=>a+v,0)||1;
  miniTitle.textContent=`${leaf} · ${fmt(total)}`;
  const MW=380, nodeW=9, leftX=14, rightX=150, pad=8, gap=3, minSlot=15;
  const sc=180/total, slots=parts.map(([,v])=>Math.max(v*sc,minSlot));
  const contentH=slots.reduce((a,s)=>a+s,0)+gap*Math.max(0,parts.length-1), H=contentH+pad*2;
  miniSvg.setAttribute('viewBox',`0 0 ${MW} ${H}`); miniSvg.setAttribute('width',MW); miniSvg.setAttribute('height',H); miniSvg.innerHTML='';
  const leftH=total*sc, leftY=pad+(contentH-leftH)/2; let y=pad, soff=0;
  parts.forEach(([dn,v],i)=>{
    const bar=v*sc, slot=slots[i], ry=y+(slot-bar)/2;
    const sx=leftX+nodeW, tx=rightX, sy=leftY+soff+bar/2, ty=ry+bar/2, xm=(sx+tx)/2, t=Math.max(bar,1)/2;
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M${sx},${sy-t} C${xm},${sy-t} ${xm},${ty-t} ${tx},${ty-t} L${tx},${ty+t} C${xm},${ty+t} ${xm},${sy+t} ${sx},${sy+t} Z`);
    p.setAttribute('fill',color); p.setAttribute('fill-opacity','.38'); miniSvg.appendChild(p); soff+=bar;
    const rr=document.createElementNS(NS,'rect'); rr.setAttribute('x',rightX); rr.setAttribute('y',ry);
    rr.setAttribute('width',nodeW); rr.setAttribute('height',Math.max(1,bar)); rr.setAttribute('rx',2); rr.setAttribute('fill',color); miniSvg.appendChild(rr);
    const tl=document.createElementNS(NS,'text'); tl.setAttribute('x',rightX+nodeW+6); tl.setAttribute('y',ry+bar/2);
    tl.setAttribute('class','mtx'); tl.textContent=`${dn}  ${fmt(v)} · ${(v/total*100).toFixed(0)}%`; miniSvg.appendChild(tl);
    y+=slot+gap;
  });
  const lr=document.createElementNS(NS,'rect'); lr.setAttribute('x',leftX); lr.setAttribute('y',leftY);
  lr.setAttribute('width',nodeW); lr.setAttribute('height',Math.max(1,leftH)); lr.setAttribute('rx',2); lr.setAttribute('fill',color); miniSvg.appendChild(lr);
  return H;
}
function showMini(e,leaf,color){
  if(leaf!==miniLeaf){ miniH=renderMini(leaf,color); miniLeaf=leaf; miniEl.style.opacity=1; }
  let left=e.clientX+16, top=e.clientY+16; const w=400, h=miniH+34;
  if(left+w>window.innerWidth) left=e.clientX-w-8;
  if(top+h>window.innerHeight) top=Math.max(8,window.innerHeight-h-8);
  miniEl.style.left=left+'px'; miniEl.style.top=top+'px';
}
function hideMini(){ miniEl.style.opacity=0; miniLeaf=null; }

/* ---- render sankey ------------------------------------------------------- */
function render(res){
  svg.innerHTML=''; const {links, income}=res;
  if(!links.length || income<=0){ svg.style.display='none'; return; }
  svg.style.display='block';
  const nodes={};
  const ensure=n=>{ if(!nodes[n]) nodes[n]={name:n,in:0,out:0,outLinks:[],inLinks:[]}; return nodes[n]; };
  links.forEach(([s,t,v])=>{ const S=ensure(s),T=ensure(t),l={s,t,v,src:S,tgt:T}; S.out+=v; S.outLinks.push(l); T.in+=v; T.inLinks.push(l); });
  const NL=Object.values(nodes); NL.forEach(n=> n.value=Math.max(n.in,n.out));
  const layerOf=n=> n.in===0?0:1+Math.max(...n.inLinks.map(l=>layerOf(l.src)));
  NL.forEach(n=> n.layer=layerOf(n));
  const maxLayer=Math.max(...NL.map(n=>n.layer));
  const band=n=> n.layer===0 ? n.outLinks[0].tgt.name : n.layer===maxLayer ? n.inLinks[0].src.name : n.name;
  const nodeColor=n=> n.layer<=1 ? INCOME : n.name==='Total income' ? BUDGET : n.name==='Expenses' ? EXPC : n.name==='Savings' ? GROUPCOL.Savings : (GROUPCOL[band(n)]||BUDGET);
  const linkColor=l=> l.tgt.layer<=2 ? INCOME : l.tgt.name==='Expenses' ? EXPC : l.tgt.name==='Savings' ? GROUPCOL.Savings : l.src.name==='Expenses' ? (GROUPCOL[l.tgt.name]||EXPC) : (GROUPCOL[l.src.name]||BUDGET);
  const scale=curScale;   // fixed px-per-€ so the diagram grows/shrinks with the period's absolute size
  const byLayer=[]; for(let i=0;i<=maxLayer;i++) byLayer[i]=NL.filter(n=>n.layer===i);
  byLayer.forEach(col=>col.sort((a,b)=>{ const r=ORDER.indexOf(band(a))-ORDER.indexOf(band(b)); return r!==0?r:b.value-a.value; }));
  const used=byLayer.map(col=>col.reduce((a,n)=>a+Math.max(n.value*scale,MINSLOT),0)+(col.length-1)*GAP);
  const contentH=Math.max(...used);
  const xOf=L=> LEFTM + L*((W-LEFTM-RIGHTM-NODEW)/maxLayer);
  byLayer.forEach((col,ci)=>{ let y=PAD_T+(contentH-used[ci])/2;
    col.forEach(n=>{ const bar=n.value*scale, slot=Math.max(bar,MINSLOT); n.x=xOf(ci); n.h=bar; n.y=y+(slot-bar)/2; y+=slot+GAP; }); });
  const H=PAD_T+contentH+PAD_B; svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
  NL.forEach(n=>{ n.outLinks.sort((a,b)=>a.tgt.y-b.tgt.y); n.inLinks.sort((a,b)=>a.src.y-b.src.y);
    let so=0; n.outLinks.forEach(l=>{ l.soff=so; so+=l.v*scale; });
    let io=0; n.inLinks.forEach(l=>{ l.ioff=io; io+=l.v*scale; }); });
  const ribbon=l=>{ const th=l.v*scale, sx=l.src.x+NODEW, tx=l.tgt.x, sy=l.src.y+l.soff+th/2, ty=l.tgt.y+l.ioff+th/2, xm=(sx+tx)/2, t=th/2;
    return `M${sx},${sy-t} C${xm},${sy-t} ${xm},${ty-t} ${tx},${ty-t} L${tx},${ty+t} C${xm},${ty+t} ${xm},${sy+t} ${sx},${sy+t} Z`; };
  NL.forEach(n=> n.outLinks.forEach(l=>{ const p=document.createElementNS(NS,'path');
    p.setAttribute('d',ribbon(l)); p.setAttribute('fill',linkColor(l)); p.setAttribute('class','link');
    p.addEventListener('mousemove',e=>showTip(e,`${l.s} → ${l.t}: ${fmt(l.v)}`)); p.addEventListener('mouseleave',hideTip); svg.appendChild(p); }));
  NL.forEach(n=>{ const g=document.createElementNS(NS,'g'); g.setAttribute('class','node');
    const r=document.createElementNS(NS,'rect'); r.setAttribute('x',n.x); r.setAttribute('y',n.y);
    r.setAttribute('width',NODEW); r.setAttribute('height',Math.max(1,n.h)); r.setAttribute('rx',2); r.setAttribute('fill',nodeColor(n));
    const isExpLeaf = n.layer===maxLayer && detailFor(n.name).length>0;
    r.addEventListener('mousemove',e=>{ if(isExpLeaf){ showMini(e,n.name,nodeColor(n)); }
      else showTip(e,`<b>${n.name}</b> ${fmt(n.value)} <span style="color:#9aa6bd">(${(n.value/income*100).toFixed(0)}% of income)</span>`); });
    r.addEventListener('mouseleave',()=>{ hideTip(); hideMini(); }); g.appendChild(r);
    const label=document.createElementNS(NS,'text'); const mid=n.y+n.h/2;
    if(n.layer===0 || n.layer===maxLayer){
      const left=n.layer===0;
      label.setAttribute('x', left? n.x-8 : n.x+NODEW+8); label.setAttribute('text-anchor', left?'end':'start'); label.setAttribute('y',mid);
      const a=document.createElementNS(NS,'tspan'); a.textContent=n.name;
      const b=document.createElementNS(NS,'tspan'); b.setAttribute('class','nval'); b.textContent=' '+fmt(n.value)+'  '+(n.value/income*100).toFixed(0)+'%';
      label.append(a,b);
    }else{
      label.setAttribute('x',n.x+NODEW/2); label.setAttribute('text-anchor','middle'); label.setAttribute('y',mid); label.setAttribute('class','mid');
      const pctTxt = income>0 && n.name!=='Total income' ? '  '+(n.value/income*100).toFixed(0)+'%' : '';
      label.textContent = `${n.name}  ${fmt(n.value)}${pctTxt}`;
    }
    g.appendChild(label); svg.appendChild(g); });
}
function paintTotals(res){
  const {income,expGrp,sav}=res;
  const totExp=["Needs","Wants","Liberality","Taxes"].reduce((a,g)=>a+(expGrp[g]||0),0);
  const cards=[["Income",income,INCOME],["Expenses",totExp,EXPC]];
  if(sav>0) cards.push(["Savings",sav,GROUPCOL.Savings]);
  const pct=v=> income>0 ? (v/income*100).toFixed(0)+'% of income' : '';
  document.getElementById('totals').innerHTML=cards.map(([lab,v,c],i)=>
    `<div class="tot"><div class="lab">${lab}</div><div class="val" style="color:${c}">${fmt(v)}</div><div class="pct">${i===0?'':pct(v)}</div></div>`).join('');
}

/* ---- draggable month-range slider (with movable window) ------------------ */
const modeEl=document.getElementById('mode'), yearEl=document.getElementById('year'), monthEl=document.getElementById('month'),
      monthlyEl=document.getElementById('tMonthly'), dualEl=document.getElementById('dual'),
      rFill=document.getElementById('rFill'), hLo=document.getElementById('hLo'), hHi=document.getElementById('hHi'),
      rLoL=document.getElementById('rLo'), rHiL=document.getElementById('rHi');
const MONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const maxIdx=()=> META.maxMi-META.minMi;
let loIdx=0, hiIdx=0, drag=null, dragStart=0, dragLo=0, dragHi=0;
function updateSliderUI(){
  const N=maxIdx()||1, lp=loIdx/N*100, hp=hiIdx/N*100;
  hLo.style.left=lp+'%'; hHi.style.left=hp+'%'; rFill.style.left=lp+'%'; rFill.style.width=(hp-lp)+'%';
  rLoL.textContent=miLabel(META.minMi+loIdx); rHiL.textContent=miLabel(META.minMi+hiIdx);
}
function setSlider(lo,hi){ const N=maxIdx(); loIdx=Math.max(0,Math.min(N,Math.round(lo))); hiIdx=Math.max(0,Math.min(N,Math.round(hi)));
  if(loIdx>hiIdx)[loIdx,hiIdx]=[hiIdx,loIdx]; updateSliderUI(); }
function idxFromX(clientX){ const r=dualEl.getBoundingClientRect(), N=maxIdx(); let f=(clientX-r.left)/r.width; f=Math.max(0,Math.min(1,f)); return Math.round(f*N); }
hLo.addEventListener('pointerdown',e=>{ drag='lo'; e.preventDefault(); });
hHi.addEventListener('pointerdown',e=>{ drag='hi'; e.preventDefault(); });
rFill.addEventListener('pointerdown',e=>{ drag='band'; dragStart=idxFromX(e.clientX); dragLo=loIdx; dragHi=hiIdx; e.preventDefault(); });
window.addEventListener('pointermove',e=>{
  if(!drag) return; const idx=idxFromX(e.clientX), N=maxIdx();
  if(drag==='lo') loIdx=Math.min(idx,hiIdx);
  else if(drag==='hi') hiIdx=Math.max(idx,loIdx);
  else { const w=dragHi-dragLo; let nl=dragLo+(idx-dragStart), nh=nl+w; if(nl<0){nl=0;nh=w;} if(nh>N){nh=N;nl=N-w;} loIdx=nl; hiIdx=nh; }
  updateSliderUI(); build();
});
window.addEventListener('pointerup',()=>{ drag=null; });
function presetRange(){
  const mode=modeEl.value, y=+yearEl.value, m=+monthEl.value;
  if(mode==='all') return [META.minMi, META.maxMi];
  if(mode==='year') return [y*12, Math.min(META.maxMi, y*12+11)];
  const mi=y*12+(m-1);
  if(mode==='month') return [mi, mi];
  return [Math.max(META.minMi, mi-11), mi];
}
function applyPreset(){ const [f,t]=presetRange(); setSlider(f-META.minMi, t-META.minMi); build(); }

/* ---- net worth table (holdings: value + Δ month / year / overall) -------- */
function buildNetWorth(){
  const holds=NWHOLD; const wrap=document.getElementById('nwwrap');
  if(!holds.length){ wrap.innerHTML=''; return; }
  const cur=META.allMaxMi, m1=cur-1, y1=cur-12;   // month = vs previous month, year = vs 12 months ago
  const cumAt=(h,mi)=>{ let s=0; const f=h.flows; for(const k in f){ if(+k<=mi) s+=f[k]; } return s; };
  const rows=holds.map(h=>{
    const v=cumAt(h,cur), bM=cumAt(h,m1), bY=cumAt(h,y1), tin=h.tin||0;
    // Overall = current value vs total capital ever transferred into the investing account (return on capital)
    return {vary:h.vary,acd:h.acd,acct:h.acct,cat:h.cat, v, dM:v-bM,bM, dY:v-bY,bY, dO:v-tin,tin};
  }).filter(r=> Math.abs(r.v)>0.5 || Math.abs(r.tin)>0.5);
  const cap=s=> s ? s.charAt(0)+s.slice(1).toLowerCase() : s;
  const order=["VARIABLE","NONVARIABLE"];
  const rank=v=>{ const i=order.indexOf(v); return i<0?9:i; };
  // group by variability, rows ordered highest value to lowest
  rows.sort((a,b)=>{ let r=rank(a.vary)-rank(b.vary); if(r) return r; return b.v-a.v; });
  const groups={}; rows.forEach(r=>{ (groups[r.vary]=groups[r.vary]||[]).push(r); });
  const dcell=(d,base)=>{ const pct=Math.abs(base)>0.5 ? d/Math.abs(base)*100 : null;
    const cls=d>=0?'pos':'neg';
    const p=pct===null?'':`<span class="dp">${d>=0?'+':''}${pct.toFixed(1)}%</span>`;
    return `<td class="${cls}">${d>=0?'+':'\u2212'}${fmt(Math.abs(d))} ${p}</td>`; };
  const ocell=(d,tin)=> tin>0.5 ? dcell(d,tin) : `<td></td>`;   // overall only for invested holdings
  const blanks=`<td></td><td></td><td></td>`;                  // deltas only for variable holdings
  const vcell=v=>`<td class="val ${v<0?'neg':''}">${v<0?'('+fmt(-v)+')':fmt(v)}</td>`;
  let h=`<table class="nw"><thead><tr>`+
    `<th class="grp">Variability</th><th class="grp">Category</th><th class="grp">Asset class details</th><th class="grp">Account</th>`+
    `<th>Value</th><th title="vs previous month">\u0394 Month</th><th title="vs 12 months ago">\u0394 Year</th><th title="current value vs total capital transferred into the investing account (ever)">\u0394 Overall</th></tr></thead><tbody>`;
  const varyOrder=order.concat(Object.keys(groups).filter(k=>order.indexOf(k)<0)).filter(v=>groups[v]&&groups[v].length);
  // first pass: aggregate subtotals + grand total (deltas only from variable holdings)
  const sub={}; let gTot=0,gM=0,gY=0,gO=0,gBM=0,gBY=0,gTin=0;
  varyOrder.forEach(vary=>{
    const isVar=vary==="VARIABLE"; let sTot=0,sM=0,sY=0,sO=0,sBM=0,sBY=0,sTin=0;
    groups[vary].forEach(r=>{ sTot+=r.v; sM+=r.dM; sY+=r.dY; sO+=r.dO; sBM+=r.bM; sBY+=r.bY; sTin+=r.tin; });
    sub[vary]={isVar,sTot,sM,sY,sO,sBM,sBY,sTin};
    gTot+=sTot; if(isVar){ gM+=sM; gY+=sY; gO+=sO; gBM+=sBM; gBY+=sBY; gTin+=sTin; }
  });
  // totals at the beginning: grand total, then each group's subtotal
  h+=`<tr class="tot"><td class="t" colspan="4">Net worth</td>`+vcell(gTot)+dcell(gM,gBM)+dcell(gY,gBY)+ocell(gO,gTin)+`</tr>`;
  varyOrder.forEach(vary=>{ const s=sub[vary];
    const subDeltas = s.isVar ? dcell(s.sM,s.sBM)+dcell(s.sY,s.sBY)+ocell(s.sO,s.sTin) : blanks;
    h+=`<tr class="sub"><td class="t" colspan="4">${cap(vary)} \u2014 subtotal</td>`+vcell(s.sTot)+subDeltas+`</tr>`;
  });
  // then the holding rows, grouped
  varyOrder.forEach(vary=>{
    const isVar=sub[vary].isVar;
    groups[vary].forEach(r=>{
      const deltas = isVar ? dcell(r.dM,r.bM)+dcell(r.dY,r.bY)+ocell(r.dO,r.tin) : blanks;
      h+=`<tr><td class="mut">${cap(r.vary)}</td><td class="mut">${r.cat}</td><td class="t">${r.acd}</td><td class="mut">${r.acct}</td>`+
        vcell(r.v)+deltas+`</tr>`;
    });
  });
  h+=`</tbody></table>`;
  wrap.innerHTML=h;
}

/* ---- main build ---------------------------------------------------------- */
function build(){
  curMiF=META.minMi+loIdx; curMiT=META.minMi+hiIdx;
  const res=computeLinks(curMiF,curMiT); const monthly=monthlyEl.checked; curDiv=monthly?res.months:1;
  curScale = TARGET_H / (monthly ? META.refMonth : META.refWindow);   // fixed scale => sizes comparable across periods
  let plabel=`${miLabel(curMiF)} — ${miLabel(curMiT)}`;
  if(monthly && res.months>0){
    res.links=res.links.map(([s,t,v])=>[s,t,v/res.months]); res.income/=res.months; res.sav/=res.months;
    for(const g in res.expGrp) res.expGrp[g]/=res.months;
    plabel += ` · per-month average over ${res.months} month${res.months>1?'s':''}`;
  }
  document.getElementById('periodLabel').textContent=plabel;
  paintTotals(res); render(res);
}

/* ---- load ---------------------------------------------------------------- */
async function load(){
  const st=document.getElementById('status');
  try{
    const resp=await fetch(CSV_URL,{cache:"no-store"}); if(!resp.ok) throw new Error("HTTP "+resp.status);
    aggregate(parseCSV(await resp.text()));
    if(!DATA.length) throw new Error("No usable rows (check the sheet is shared 'anyone with the link → Viewer' and named DB).");
    META.years.forEach(y=>{ const o=document.createElement('option'); o.value=y; o.textContent=y; yearEl.appendChild(o); });
    MONTHS.forEach((m,i)=>{ const o=document.createElement('option'); o.value=i+1; o.textContent=m; monthEl.appendChild(o); });
    const maxYear=Math.floor(META.maxMi/12), maxMonth=META.maxMi%12+1; yearEl.value=maxYear; monthEl.value=maxMonth;
    setSlider(maxIdx()-11, maxIdx());          // default trailing 12
    [modeEl,yearEl,monthEl].forEach(el=>el.addEventListener('change',applyPreset));
    monthlyEl.addEventListener('change',build);
    document.getElementById('tK').addEventListener('change',e=>{ showK=e.target.checked; build(); buildNetWorth(); });
    st.style.display='none';
    document.getElementById('controls').style.display='';
    document.getElementById('rangeBox').style.display='';
    document.getElementById('nwhead').style.display='';
    build(); buildNetWorth();
  }catch(err){
    st.className='status err';
    st.innerHTML=`Could not load the sheet: ${err.message}<br>Make sure the Google Sheet is shared as <b>“Anyone with the link → Viewer”</b> and has a tab named <b>DB</b>.`;
  }
}
load();
