  const box=document.getElementById('sparkbox');
  if(box){
    const ln=document.getElementById('scrubline'), dot=document.getElementById('scrubdot'), val=document.getElementById('scrubval');
    const show=x=>{ const r=box.getBoundingClientRect(); if(!r.width) return;
      const f=Math.min(1,Math.max(0,(x-r.left)/r.width)), i=Math.round(f*(series.length-1)), v=series[i];
      const px=i/(series.length-1)*100, py=yOf(v)/SH*100;
      ln.style.left=px+'%'; dot.style.left=px+'%'; dot.style.top=py+'%';
      box.classList.add('on'); val.classList.add('on');
      val.innerHTML=`${mLab(s0+i)} \u00B7 <b>${money(v)}</b>`; };
    const hide=()=>{ box.classList.remove('on'); val.classList.remove('on'); val.textContent='drag the line'; };
    box.addEventListener('pointerdown',e=>{ show(e.clientX); });
    box.addEventListener('pointermove',e=>{ if(e.pointerType==='mouse' || e.buttons) show(e.clientX); });
    box.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') hide(); });
  }

  // assets table: group by category, ordered by absolute subtotal (biggest positions
  // first); the account rows inside a category are ordered by value (high -> low) and
  // are only rendered when that category is open. The LIABILITIES category is kept
  // out of it and rendered last, in its own table.
  const isLiab=r=>r.cat==="LIABILITIES";
  const groupCats=list=>{ const m={}; list.forEach(r=>{ (m[r.cat]=m[r.cat]||[]).push(r); });
    return {m, order:Object.keys(m).sort((a,b)=>Math.abs(sumV(m[b]))-Math.abs(sumV(m[a])))}; };
  const A=groupCats(rows.filter(r=>!isLiab(r))), L=groupCats(rows.filter(isLiab));
  const catOrder=[...A.order, ...L.order];   // every collapsible group, assets first
  const esc=s=> String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

  /* two tables, assets first then liabilities, same two-column layout (name | value)
     so they fit a phone without sideways scroll. Every category starts collapsed;
     Expand all / Collapse all act on both tables. */
  const table=(title,cls,G)=>{
    if(!G.order.length) return '';
    // the header row carries the table total (all categories, open or collapsed)
    const tot=G.order.reduce((s,c)=>s+sumV(G.m[c]),0);
    let t=`<table class="nw ${cls}"><colgroup><col><col class="cval"></colgroup><thead><tr class="nwtotal">`+
          `<th class="grp">Total ${title.toLowerCase()}</th>`+
          `<th class="v ${tot<0?'neg':'pos'}">${tot<0?'('+fmt(-tot)+')':fmt(tot)}</th></tr></thead><tbody>`;
    G.order.forEach(cat=>{
      // assets: high -> low; liabilities: largest debt first
      const cl=G.m[cat].slice().sort(cls==='liab' ? (a,b)=>a.v-b.v : (a,b)=>b.v-a.v);
      const open=nwOpen.has(cat);
      t+=`<tr class="sub cgroup" data-cat="${esc(cat)}" tabindex="0" role="button" aria-expanded="${open}">`+
         `<td class="t"><span class="tw">${open?'\u25BE':'\u25B8'}</span>${cap(cat)}</td>`+vcell(sumV(cl))+`</tr>`;
      if(open) cl.forEach(r=>{
        // sub-line always shown, even when it repeats the account (e.g. Cash / Cash)
        // live rows: "LIVE · Vwce · 1.091 × 170,61" (shares from LIST, price from GOOGLEFINANCE)
        const liveTxt = r.live ? '<b class="live">LIVE</b> \u00B7 ' : '';
        const qtyTxt = r.live && !r.live.capgain ? ` \u00B7 ${qty(r.live.shares)} \u00D7 ${px(r.live.price)}` : '';
        const acd=r.acd && r.acd!=='\u2014' ? `<span class="acd">${liveTxt}${esc(cap(r.acd))}${qtyTxt}</span>` : '';
        if(!r.det){ t+=`<tr class="kid"><td class="t2">${esc(cap(r.acct))}${acd}</td>`+vcell(r.v)+`</tr>`; return; }
        // CREDITS / DEBTS: the account row itself toggles its DETAIL lines
        const dOpen=nwDetOpen.has(r.hk);
        t+=`<tr class="kid dexp" data-hk="${esc(r.hk)}" tabindex="0" role="button" aria-expanded="${dOpen}">`+
           `<td class="t2"><span class="tw">${dOpen?'\u25BE':'\u25B8'}</span>${esc(cap(r.acct))}${acd}</td>`+vcell(r.v)+`</tr>`;
        if(dOpen) r.det.forEach(d=>{ t+=`<tr class="kdet"><td class="t3">${esc(d.n)}</td>`+vcell(d.v)+`</tr>`; });
      });
    });
    return t+`</tbody></table>`;
  };
  const allOpen=catOrder.every(c=>nwOpen.has(c)), noneOpen=catOrder.every(c=>!nwOpen.has(c));
  wrap.innerHTML=`<div class="nwtools">`+
    `<button type="button" data-nwall="open"${allOpen?' disabled':''}>Expand all</button>`+
    `<button type="button" data-nwall="close"${noneOpen?' disabled':''}>Collapse all</button></div>`+
    `<div class="nwgrid">`+table('Assets','assets',A)+table('Liabilities','liab',L)+`</div>`;
  // expand / collapse a category (click or keyboard), then re-render off nwOpen
  const toggleCat=cat=>{ if(nwOpen.has(cat)) nwOpen.delete(cat); else nwOpen.add(cat); buildNetWorth(); };
  wrap.querySelectorAll('tr.cgroup').forEach(tr=>{
    const cat=tr.getAttribute('data-cat');
    tr.addEventListener('click',()=>toggleCat(cat));
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleCat(cat); } });
  });
  // CREDITS / DEBTS account rows: tap to show / hide their DETAIL lines
  const toggleDet=hk=>{ if(nwDetOpen.has(hk)) nwDetOpen.delete(hk); else nwDetOpen.add(hk); buildNetWorth(); };
  wrap.querySelectorAll('tr.dexp').forEach(tr=>{
    const hk=tr.getAttribute('data-hk');
    tr.addEventListener('click',()=>toggleDet(hk));
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toggleDet(hk); } });
  });
  // expand all / collapse all categories at once (collapse also closes detail lines)
  wrap.querySelectorAll('button[data-nwall]').forEach(b=>b.addEventListener('click',()=>{
    const open=b.getAttribute('data-nwall')==='open';
    nwOpen = open ? new Set(catOrder) : new Set();
    if(!open) nwDetOpen=new Set();
    buildNetWorth();
  }));
  renderYlp();   // live net worth may have moved the "Now" point (no-op when unchanged)
}

/* ---- Cash Flow vs Savings (yearly bars + savings-rate lines) --------------
   One column per calendar year, actuals only (from the first year of data up to
   the current month; nothing after today is drawn, no forecast years).
     up   = income, stacked Safe (Base + TFR + Food tickets) / Stocks / Other
     down = expenses, stacked Needs / Wants / Liberality / Taxes (/ Other)
     lines= savings rate on total income  ((income - expenses) / income)
            and on safe income            ((safe - expenses) / safe)
   Window-independent like the Yearly trend (ignores the range bar), but it honours
   the exclusions: an excluded income / expense leaf or macro group drops out of
   the bars and both rates. Avg/m divides each year by the months of that year
   present in the data (keeps the in-progress year comparable); K applies to every
   label. No legend: the colour keys show in the hover / tap tooltip. */
const CF_SAFE=new Set(['BASE','TFR','FOODTICKETS']);
const CF_INC=[['safe','Safe','#2e8b57','Base + TFR + Food tickets'],
              ['stocks','Stocks','#63c28b','Stock vesting'],
              ['other','Other','#b5e3c6','Every other income (commute, one-off, heritage, passion, real estate, bonus, ...)']];
const CF_EXP=[['Needs','Needs','#b03a3a'],['Wants','Wants','#dc5b55'],['Liberality','Liberality','#ec958f'],
              ['Taxes','Taxes','#f6c4c0'],['Other','Other exp.','#c9a7a7']];
const CF_LINE_TOT='#e7ecf5', CF_LINE_SAFE='#9aa6bd';
/* pure: DATA rows -> [{year, months, inc:{safe,stocks,other}, exp:{group:spend}, income, safe,
   expenses, rateTot, rateSafe}] oldest -> newest, rows after lastMi ignored. Rates are %
   (null when their base income is <= 0); expenses are positive spend. */
function cashFlowByYear(data, lastMi, excluded, bucket){
  /* bucket(mi) -> output key (calendar year by default); null skips the row. The month
     drill-down passes mi=>(year of mi === Y ? mi : null), so each row is one month */
  const by={}, ds=excluded||new Set(), bk=bucket||(mi=>Math.floor(mi/12));
  (data||[]).forEach(([mi,k,grp,leaf,val])=>{
    if(mi>lastMi) return;
    const y=bk(mi); if(y==null) return;
    const b=by[y]||(by[y]={mset:{}, nz:false, inc:{safe:0,stocks:0,other:0}, exp:{}});
    /* months and the "year has data" flag count every row, so Avg/m divisors and the
       year axis do not move when entries are excluded */
    b.mset[mi]=1; if(val) b.nz=true;
    /* same Entry keys as the Sankey's Selection_State */
    if(k==='I' ? (ds.has('I|'+leaf)||ds.has('IG|'+grp)) : (ds.has('E|'+leaf)||ds.has('EG|'+grp))) return;
    if(k==='I') b.inc[CF_SAFE.has(leaf)?'safe':leaf==='STOCKS'?'stocks':'other']+=val;
    else b.exp[grp]=(b.exp[grp]||0)-val;          // expenses stored negative -> positive spend
  });
  return Object.keys(by).map(Number).sort((a,b)=>a-b).map(y=>{
    const b=by[y], income=b.inc.safe+b.inc.stocks+b.inc.other,
          expenses=Object.values(b.exp).reduce((a,v)=>a+v,0);
    return {year:y, nz:b.nz, months:Object.keys(b.mset).length, inc:b.inc, exp:b.exp, income, safe:b.inc.safe, expenses,
      rateTot:  income>0     ? (income-expenses)/income*100         : null,
      rateSafe: b.inc.safe>0 ? (b.inc.safe-expenses)/b.inc.safe*100 : null};
  }).filter(r=>r.nz);                             // drops blank-date rows (Dec 1899)
}

/* ---- single-series mode: plot one category / label / detail per year -------
   Selection keys (the #cfSel <select>):
     T|inc  T|safe  T|exp  T|sav  T|safesav     totals
     IG|<income group>   EG|<expense macro group>
     I|<income leaf>     E|<expense leaf>        D|<expense leaf>|<detail>
   Totals honour every exclusion; a group honours the exclusions of its leaves (not
   of itself, it was picked explicitly); a leaf or a detail ignores exclusions.
   Pure: returns {year: raw value} (income positive, spend positive, savings signed). */
function cfSeriesByYear(sel, data, detail, lastMi, excluded, bucket){
  /* bucket(mi) picks the output key: calendar year by default, mi=>mi for monthly */
  const bk=bucket||(mi=>Math.floor(mi/12));
  const out={}, ds=excluded||new Set(), p=sel.indexOf('|'), kind=sel.slice(0,p), name=sel.slice(p+1);
  const add=(mi,v)=>{ if(mi>lastMi) return; const y=bk(mi); if(y==null) return; out[y]=(out[y]||0)+v; };
  if(kind==='D'){
    const q=name.indexOf('|'), lf=name.slice(0,q), dn=name.slice(q+1);
    (detail||[]).forEach(([mi,l,d,v])=>{ if(l===lf && d===dn) add(mi,v); });
    return out;
  }
  (data||[]).forEach(([mi,k,grp,leaf,val])=>{
    const lk=(k==='I'?'I|':'E|')+leaf, gk=(k==='I'?'IG|':'EG|')+grp;
    if(kind==='I'){ if(k==='I' && leaf===name) add(mi,val); return; }
    if(kind==='E'){ if(k==='E' && leaf===name) add(mi,-val); return; }
    if(ds.has(lk)) return;
    if(kind==='IG'){ if(k==='I' && grp===name) add(mi,val); return; }
    if(kind==='EG'){ if(k==='E' && grp===name) add(mi,-val); return; }
    if(ds.has(gk)) return;
    if(name==='inc'){ if(k==='I') add(mi,val); }
    else if(name==='safe'){ if(k==='I' && CF_SAFE.has(leaf)) add(mi,val); }
    else if(name==='exp'){ if(k==='E') add(mi,-val); }
    else if(name==='sav'){ add(mi,val); }                              // income + (negative) expenses
    else if(name==='safesav'){ if(k==='E' || CF_SAFE.has(leaf)) add(mi,val); }
  });
  return out;
}
/* option list for #cfSel, rebuilt once per data load. CF_OPTS maps key -> {label,
   color, base} where base = what the tooltip share is taken of ('income' | 'safe' | null). */
let cfSel='', CF_OPTS=new Map(), cfOptData=null;
function buildCfOptions(){
  const sel=document.getElementById('cfSel'); if(!sel) return;
  CF_OPTS=new Map(); cfOptData=DATA;
  const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
  const IND='\u00a0\u00a0\u00a0', IND2=IND+IND;
  const expCol=g=>(CF_EXP.find(x=>x[0]===g)||[0,0,'#dc5b55'])[2];
  const opt=(key,label,indent,color,base)=>{ CF_OPTS.set(key,{label,color,base});
    return `<option value="${esc(key)}">${indent}${esc(label)}</option>`; };
  /* structure straight from DATA / DETAIL */
  const incLeaves={}, expLeaves={}, dets={};
  DATA.forEach(([mi,k,grp,leaf])=>{ const m=(k==='I'?incLeaves:expLeaves); (m[grp]=m[grp]||new Set()).add(leaf); });
  DETAIL.forEach(([mi,lf,dn])=>{ (dets[lf]=dets[lf]||new Set()).add(dn); });
  const byOrder=(a,b)=>{ const ia=ORDER.indexOf(a), ib=ORDER.indexOf(b); return (ia<0?99:ia)-(ib<0?99:ib) || (a<b?-1:1); };
  let h=`<option value="">Overview</option><optgroup label="Income">`+
    opt('T|inc','Total income','',CF_INC[0][2],null)+opt('T|safe','Safe income','',CF_INC[0][2],'income');
  Object.keys(incLeaves).sort(byOrder).forEach(g=>{
    h+=opt('IG|'+g,g,'','#3aa86a','income');
    [...incLeaves[g]].sort((a,b)=>rankCmp('I|'+a,'I|'+b)).forEach(lf=> h+=opt('I|'+lf,lf,IND,'#63c28b','income'));
  });
  h+=`</optgroup><optgroup label="Savings">`+opt('T|sav','Savings','','#e7c14a','income')+
     opt('T|safesav','Safe savings','','#e7c14a','safe')+`</optgroup>`+
     `<optgroup label="Expenses">`+opt('T|exp','Total expenses','','#dc5b55','income')+`</optgroup>`;
  Object.keys(expLeaves).sort(byOrder).forEach(g=>{
    const c=expCol(g);
    h+=`<optgroup label="${esc(g)}">`+opt('EG|'+g,'All '+g.toLowerCase(),'',c,'income');
    [...expLeaves[g]].sort((a,b)=>rankCmp('E|'+a,'E|'+b)).forEach(lf=>{
      h+=opt('E|'+lf,lf,IND,c,'income');
      const ds=[...(dets[lf]||[])];
      if(ds.length>1) ds.sort((a,b)=>rankCmp('D|'+lf+'|'+a,'D|'+lf+'|'+b))
        .forEach(dn=> h+=opt('D|'+lf+'|'+dn,dn,IND2,c,'income'));
    });
    h+=`</optgroup>`;
  });
  sel.innerHTML=h;
  if(cfSel && !CF_OPTS.has(cfSel)) cfSel='';      // the picked entry vanished on a data refresh
  sel.value=cfSel; sel.classList.toggle('on',!!cfSel);
}
/* ---- R12M mode: rolling 12-month stacked areas, one point per month ---------
   The R12M pill next to the picker swaps the yearly bars for a monthly x axis where
   each point = the sum of the last 12 months (Avg/m: that sum / 12), so the first
   year ramps up from zero. What is stacked follows the picker:
     Overview          income tiers up (Safe / Stocks / Other), expense groups down,
                       plus the rolling savings % on income and on safe income
     Total income, Safe income, an income group   -> its income leaves
     Total expenses, a macro group                -> its labels
     a label           -> its DETAIL sub-categories
     an income leaf, a detail, Savings, Safe savings -> one (signed) area
   Exclusions follow the yearly picker rules (totals honour all, a group honours
   its leaves, a label / detail ignores them). Ends on the last COMPLETE month, so
   the last point equals the T12M cards. */
const CF_PAL=['#f28b82','#fbbc04','#81c995','#78d9ec','#a7b6f5','#d7aefb','#f6aea9','#e6c9a8',
              '#ccff90','#aecbfa','#fde293','#fdcfe8'];
/* pure: monthly raw layers [{key, label, neg, m:{mi:value}}] for a picker key */
function cfRollLayers(sel, data, detail, lastMi, excluded){
  const ds=excluded||new Set(), L=new Map();
  /* grp = the layer's macro group, used to keep the Sankey order when stacking */
  const get=(key,label,neg,grp)=>{ let l=L.get(key); if(!l){ l={key,label,neg:!!neg,grp:grp||'',m:{}}; L.set(key,l); } return l; };
  const put=(l,mi,v)=>{ l.m[mi]=(l.m[mi]||0)+v; };
  const p=sel.indexOf('|'), kind=p<0?'':sel.slice(0,p), name=p<0?'':sel.slice(p+1);
  if(kind==='E'){                                  // a label -> its details
    (detail||[]).forEach(([mi,lf,dn,v])=>{ if(lf===name && mi<=lastMi) put(get('D|'+lf+'|'+dn,dn),mi,v); });
    return [...L.values()];
  }
  const multi = kind==='' || kind==='IG' || kind==='EG' || (kind==='T' && /^(inc|safe|exp)$/.test(name));
  if(!multi){                                      // one signed series, same rules as the yearly bars
    return [{key:sel, label:sel, neg:false, single:true, m:cfSeriesByYear(sel,data,detail,lastMi,ds,mi=>mi)}];
  }
  (data||[]).forEach(([mi,k,grp,leaf,val])=>{
    if(mi>lastMi) return;
    if(ds.has((k==='I'?'I|':'E|')+leaf)) return;
    if(kind!=='IG' && kind!=='EG' && ds.has((k==='I'?'IG|':'EG|')+grp)) return;
    if(kind===''){
      if(k==='I'){ const t=CF_SAFE.has(leaf)?'safe':leaf==='STOCKS'?'stocks':'other'; put(get('t|'+t,t),mi,val); }
      else put(get('g|'+grp,grp,true),mi,-val);
      return;
    }
    if(k==='I' && (kind==='IG' ? grp===name : name==='inc' || (name==='safe' && CF_SAFE.has(leaf))))
      put(get('I|'+leaf,leaf,false,grp),mi,val);
    else if(k==='E' && (kind==='EG' ? grp===name : name==='exp'))
      put(get('E|'+leaf,leaf,false,grp),mi,-val);
  });
  return [...L.values()];
}
/* pure: rolling 12-month sums over [m0, m1] -> array (months before m0 count as 0
   only when they hold no data; the window reads whatever exists) */
function rolling12(m, m0, m1){
  const out=[]; let s=0;
  for(let mi=m0-11; mi<m0; mi++) s+=m[mi]||0;
  for(let mi=m0; mi<=m1; mi++){ s+=m[mi]||0; out.push(s); s-=m[mi-11]||0; }
  return out;
}
const niceStep=x=>{ if(!(x>0)) return 1; const p=Math.pow(10,Math.floor(Math.log10(x))), f=x/p;
  return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; };
function renderRolling(svgEl, W, narrow, perMonth){
  const m0=META.minMi, m1=lastCompleteMi(), N=m1-m0+1;
  const el=(tag,attrs,txt)=>{ const e=document.createElementNS(NS,tag);
    for(const k in attrs) e.setAttribute(k,attrs[k]); if(txt!=null) e.textContent=txt; return e; };
  svgEl.innerHTML='';
  if(N<2) return;
  const info=cfSel ? CF_OPTS.get(cfSel) : null, ov=!cfSel, div=perMonth?12:1;
  let layers=cfRollLayers(cfSel, DATA, DETAIL, m1, deselected)
    .map(l=>Object.assign(l,{r:rolling12(l.m,m0,m1).map(v=>v/div)}));
  const single=layers.length===1 && !ov;
  /* order (first = closest to the zero line) and colours */
  if(ov){
    const ti=k=>CF_INC.findIndex(x=>'t|'+x[0]===k), gi=k=>CF_EXP.findIndex(x=>'g|'+x[0]===k);
    layers.forEach(l=>{ if(l.neg){ const i=gi(l.key); l.color=(CF_EXP[i]||CF_EXP[4])[2]; l.label=(CF_EXP[i]||[0,l.label])[1]; l.o=i<0?99:i; }
      else { const i=ti(l.key); l.color=CF_INC[i][2]; l.label=CF_INC[i][1]; l.o=i; } });
    layers.sort((a,b)=>a.o-b.o);
  } else if(single){
    layers[0].color=info.color; layers[0].label=info.label;
  } else {
    /* Sankey order: macro groups in ORDER from the zero line up (Needs, Wants,
       Liberality, Taxes / Work income, Non-work income), then Stable_Order inside each
       group (biggest at the bottom of its group). Every label keeps its own layer:
       small ones are NOT folded into an "Other" layer (Stefano's call, Oct 2026). */
    const gOrd=g=>{ const i=ORDER.indexOf(g); return i<0?99:i; };
    const sankeyCmp=(a,b)=> gOrd(a.grp)-gOrd(b.grp) || rankCmp(a.key,b.key);
    layers=layers.filter(l=>l.r.some(v=>Math.abs(v)>0.5));   // drop layers that are empty over the whole axis
    layers.sort(sankeyCmp);
    /* several groups stacked (Total expenses / Total income / Safe income): tint each
       layer with its Sankey group colour, darker at the bottom of the group, lighter
       towards the top, so the group bands read as blocks. One group: palette colours. */
    const groups=[...new Set(layers.map(l=>l.grp))];
    if(groups.length>1){
      const hue=g=> GROUPCOL[g] || (g==='Work income' ? INCOME : g==='Non-work income' ? '#2fb7a6' : g==='Other income' ? '#7fc8a0' : '#9aa6bd');
      const mix=(hex,t)=>{ const n=parseInt(hex.slice(1),16), c=[n>>16,(n>>8)&255,n&255]
          .map(v=>Math.round(t<0 ? v*(1+t) : v+(255-v)*t)); return '#'+c.map(v=>v.toString(16).padStart(2,'0')).join(''); };
      groups.forEach(g=>{ const ls=layers.filter(l=>l.grp===g), n=ls.length;
        ls.forEach((l,i)=>{ l.color=mix(hue(g), n>1 ? -0.3+0.75*i/(n-1) : 0); }); });
    }
    /* one group: the fixed palette, then golden-angle hues once it runs out, so
       neighbouring layers never share a colour */
    layers.forEach((l,i)=>{ if(!l.color) l.color= i<CF_PAL.length ? CF_PAL[i] : `hsl(${Math.round((i*137.5)%360)},62%,70%)`; });
  }
  /* stacking: positive side up, negative side down; a single series stays signed */
  const posT=new Array(N).fill(0), negT=new Array(N).fill(0);
  layers.forEach(l=>{ l.base=[]; l.top=[];
    for(let i=0;i<N;i++){
      if(single){ l.base.push(0); l.top.push(l.r[i]); continue; }
      const v=Math.max(0,l.r[i]);
      if(l.neg){ l.base.push(-negT[i]); negT[i]+=v; l.top.push(-negT[i]); }
      else { l.base.push(posT[i]); posT[i]+=v; l.top.push(posT[i]); }
    } });
  const maxPos=Math.max(1e-9,...layers.flatMap(l=>l.top), ...posT), minNeg=Math.min(0,...layers.flatMap(l=>l.top), ...negT.map(v=>-v));
  /* savings-rate lines (overview only): rolling income vs rolling expenses */
  let rTot=null, rSafe=null;
  if(ov){

function comparePeriods(data, detail, pa, pb, excluded){
  const ds=excluded||new Set(), A=periodSums(data,detail,pa[0],pa[1]), B=periodSums(data,detail,pb[0],pb[1]);
  const grpOf=Object.assign({}, B.grpOf, A.grpOf), dets={};
  [A.v,B.v].forEach(v=>{ for(const k in v){ if(k.slice(0,2)!=='D|') continue;
    const r=k.slice(2), q=r.indexOf('|'), lf=r.slice(0,q); (dets[lf]=dets[lf]||new Set()).add(r.slice(q+1)); } });
  const G=new Map(), tot={a:{inc:0,exp:0,safe:0}, b:{inc:0,exp:0,safe:0}};
  Object.keys(grpOf).forEach(key=>{
    const k=key[0], leaf=key.slice(2), g=grpOf[key], gk=(k==='I'?'IG|':'EG|')+g;
    const a=A.v[key]||0, b=B.v[key]||0;
    let gr=G.get(gk); if(!gr){ gr={key:gk, name:g, kind:k, a:0, b:0, excl:ds.has(gk), leaves:[]}; G.set(gk,gr); }
    const exL=ds.has(key);
    const details = k==='E' && dets[leaf] && dets[leaf].size>1 ? [...dets[leaf]].map(dn=>{ const dk='D|'+leaf+'|'+dn;
      return {key:dk, name:dn, a:A.v[dk]||0, b:B.v[dk]||0}; }) : [];
    gr.leaves.push({key, name:leaf, kind:k, a, b, excl:exL||gr.excl, details});
    if(!exL){ gr.a+=a; gr.b+=b; }
    if(exL || gr.excl) return;
    if(k==='I'){ tot.a.inc+=a; tot.b.inc+=b; if(CF_SAFE.has(leaf)){ tot.a.safe+=a; tot.b.safe+=b; } }
    else { tot.a.exp+=a; tot.b.exp+=b; }
  });
  const gOrd=g=>{ const i=ORDER.indexOf(g.name); return (g.kind==='I'?0:100)+(i<0?99:i); };
  return {groups:[...G.values()].sort((x,y)=>gOrd(x)-gOrd(y) || (x.name<y.name?-1:1)), tot, monthsA:A.months, monthsB:B.months};
}
/* window of a period [f, t]; nothing after the current month (the sheet may hold future rows) */
function cmpRange(mode, v){
  const hi=currentMi();
  if(mode==='year')  return [Math.max(META.minMi, v*12), Math.min(hi, v*12+11)];
  if(mode==='month') return [v, v];
  if(mode==='ytd')   return [Math.max(META.minMi, Math.floor(v/12)*12), v];
  return [Math.max(META.minMi, v-11), v];
}
/* anchor options, newest first: [value, label]; month value = mi, Year value = year */
function cmpAnchors(mode){
  const hi=currentMi(), out=[];
  if(mode==='year'){ for(let y=Math.floor(hi/12); y>=Math.floor(META.minMi/12); y--) out.push([y,String(y)]); return out; }
  const lo = mode==='trailing' ? Math.min(hi, META.minMi+11) : META.minMi;   // a T12M never starts before the data
  for(let mi=hi; mi>=lo; mi--) out.push([mi, miLabel(mi)]);
  return out;
}
function cmpClamp(mode, v){
  const L=cmpAnchors(mode); if(!L.length || L.some(x=>x[0]===v)) return v;
  return L.reduce((b,x)=> Math.abs(x[0]-v)<Math.abs(b[0]-v) ? x : b)[0];
}
/* defaults: A = latest complete period (last complete month; Year = last complete year),
   B = the same period one year earlier (Month: the month before) */
function cmpDefaultA(mode){ const lc=lastCompleteMi();
  return cmpClamp(mode, mode==='year' ? Math.floor(lc/12)-(lc%12===11?0:1) : lc); }
function cmpDefaultB(mode, pa){ const end=pa[1];
  return cmpClamp(mode, mode==='year' ? Math.floor(end/12)-1 : mode==='month' ? end-1 : end-12); }
/* short column header for a window: "Oct 25\u2013Sep 26", "Jan\u2013Sep 26", "2025", "Sep 26" */
function cmpShort(f,t){
  const yy=mi=>String(Math.floor(mi/12)).slice(2);
  if(f===t) return MONTHS[f%12]+' '+yy(f);
  if(f%12===0 && t===f+11) return String(Math.floor(f/12));
  if(Math.floor(f/12)===Math.floor(t/12)) return MONTHS[f%12]+'\u2013'+MONTHS[t%12]+' '+yy(t);
  return MONTHS[f%12]+' '+yy(f)+'\u2013'+MONTHS[t%12]+' '+yy(t);
}
function syncCmpControls(){
  const set=(id,html,val)=>{ const e=document.getElementById(id); if(!e) return; e.innerHTML=html; e.value=String(val); };
  const modes=CMP_MODES.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  const anc=m=>cmpAnchors(m).map(([v,l])=>`<option value="${v}">${l}</option>`).join('');
  set('cmpModeA',modes,cmp.modeA); set('cmpA',anc(cmp.modeA),cmp.a);
  set('cmpModeB',modes,cmp.modeB); set('cmpB',anc(cmp.modeB),cmp.b);
}
/* once per data load: default T12M (last 12 complete months) vs the 12 months before;
   on a refresh keep the picks, clamped to the new data */
function cmpInit(){
  if(!cmp){ const m='trailing', a=cmpDefaultA(m); cmp={modeA:m, a, modeB:m, b:cmpDefaultB(m, cmpRange(m,a))}; }
  else { cmp.a=cmpClamp(cmp.modeA,cmp.a); cmp.b=cmpClamp(cmp.modeB,cmp.b); }
  cmpOptData=DATA; syncCmpControls();
}
/* called from every build(); redraws only when an input changed */
function renderCompare(){
  if(!pageOn('compare')) return;   // drawn when its page opens
  const wrap=document.getElementById('cmpwrap');
  if(!wrap || !DATA.length) return;
  if(DATA!==cmpOptData) cmpInit();
  const perMonth=monthlyEl.checked;
  const sig=[cmp.modeA,cmp.a,cmp.modeB,cmp.b,perMonth,showK,cmpSort,[...deselected].sort().join(','),
             [...cmpOpen].sort().join(','),[...cmpDetOpen].sort().join(',')].join('#');
  if(sig===cmpSig && DATA===cmpData) return;
  cmpSig=sig; cmpData=DATA;
  const pa=cmpRange(cmp.modeA,cmp.a), pb=cmpRange(cmp.modeB,cmp.b);
  const R=comparePeriods(DATA, DETAIL, pa, pb, deselected);
  const da=perMonth?Math.max(1,R.monthsA):1, db=perMonth?Math.max(1,R.monthsB):1;
  const esc=s=> String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const zero=v=> /^-?0K?$/.test(fmt(Math.abs(v)));
  const sgn=v=> (v<0?'\u2212':'+')+fmt(Math.abs(v));
  const pctTxt=(a,b)=>{ if(zero(b)) return zero(a) ? '' : 'new';
    const p=(a-b)/Math.abs(b)*100, q=Math.abs(p);
    if(q>=1000) return '>999%';                    // only increases can get here (a drop stops at -100%)
    return (p<0?'\u2212':'+')+(q<10 ? q.toFixed(1).replace('.',',') : Math.round(q))+'%'; };
  const rate=(inc,exp)=> inc>0 ? Math.round((inc-exp)/inc*100)+'%' : '\u2014';
  /* one row; good=+1 when up is good (income, savings), -1 when up is bad (spend) */
  const row=o=>{
    const d=o.a-o.b, z=zero(d), cls=z ? '' : ((d>0)===(o.good>0) ? 'up' : 'dn');
    const w=o.scale>0 ? Math.min(50, Math.abs(d)/o.scale*50) : 0;
    const bar=z ? '' : `<i class="${cls}" style="${d>0?'left':'right'}:50%;width:${w.toFixed(1)}%"></i>`;
    return `<tr class="${o.cls}${o.excl?' excl':''}"${o.attrs||''}>`+
      `<td class="n"${o.bl?` style="border-left-color:${o.bl}"`:''}>${o.name}<span class="ab">${fmt(o.a)} vs ${fmt(o.b)}</span>${o.sub||''}</td>`+
      `<td class="bar"><div class="bz">${bar}</div></td><td class="dl ${cls}">${z?'0':sgn(d)}</td>`+
      `<td class="pc ${cls}">${pctTxt(o.a,o.b)}</td><td class="v">${fmt(o.a)}</td><td class="v">${fmt(o.b)}</td></tr>`; };
  /* totals block, on top, with its own bar scale */
  const ta={inc:R.tot.a.inc/da, exp:R.tot.a.exp/da, safe:R.tot.a.safe/da},
        tb={inc:R.tot.b.inc/db, exp:R.tot.b.exp/db, safe:R.tot.b.safe/db};
  const tots=[
    {name:'Income', a:ta.inc, b:tb.inc, good:1},
    {name:'Expenses', a:ta.exp, b:tb.exp, good:-1},
    {name:'Savings', a:ta.inc-ta.exp, b:tb.inc-tb.exp, good:1,
     sub:`<span class="sub">${rate(ta.inc,ta.exp)} vs ${rate(tb.inc,tb.exp)} of income</span>`},
    {name:'Safe savings', a:ta.safe-ta.exp, b:tb.safe-tb.exp, good:1,
     sub:`<span class="sub">${rate(ta.safe,ta.exp)} vs ${rate(tb.safe,tb.exp)} of safe</span>`}];
  const totScale=Math.max(...tots.map(t=>Math.abs(t.a-t.b)));
  /* categories: per-period averages, rows that are zero in both periods dropped */
  const live=x=> !(zero(x.a) && zero(x.b));
  const groups=R.groups.map(g=>Object.assign({}, g, {a:g.a/da, b:g.b/db,
    leaves:g.leaves.map(l=>Object.assign({}, l, {a:l.a/da, b:l.b/db,
      details:l.details.map(x=>Object.assign({}, x, {a:x.a/da, b:x.b/db})).filter(live)})).filter(live)})).filter(g=>g.leaves.length);
  const catScale=Math.max(0, ...groups.flatMap(g=>[Math.abs(g.a-g.b), ...g.leaves.map(l=>Math.abs(l.a-l.b))]));
  const order=(list,keyOf)=> list.sort((x,y)=> cmpSort ? (Math.abs(y.a-y.b)-Math.abs(x.a-x.b) || rankCmp(keyOf(x),keyOf(y)))
                                                         : rankCmp(keyOf(x),keyOf(y)));
  const gcol=g=> g.kind==='I' ? INCOME : (GROUPCOL[g.name] || BUDGET);
  let body=tots.map((t,i)=>row(Object.assign({cls:'tot'+(i===tots.length-1?' last':''), scale:totScale}, t))).join('');
  groups.forEach(g=>{
    const open=cmpOpen.has(g.key), good=g.kind==='I'?1:-1;
    body+=row({cls:'g', name:`<span class="tw">${open?'\u25BE':'\u25B8'}</span>${esc(g.name)}`, a:g.a, b:g.b, good, excl:g.excl,
      scale:catScale, bl:gcol(g), attrs:` data-g="${esc(g.key)}" tabindex="0" role="button" aria-expanded="${open}"`});
    if(!open) return;
    order(g.leaves, l=>l.key).forEach(l=>{
      const hasD=l.details.length>1, dOpen=hasD && cmpDetOpen.has(l.key);
      body+=row({cls:'l'+(hasD?' dx':''), name:(hasD?`<span class="tw">${dOpen?'\u25BE':'\u25B8'}</span>`:'')+esc(l.name),
        a:l.a, b:l.b, good, excl:l.excl, scale:catScale,
        attrs: hasD ? ` data-l="${esc(l.key)}" tabindex="0" role="button" aria-expanded="${dOpen}"` : ''});
      if(dOpen) order(l.details, x=>x.key).forEach(x=>{
        body+=row({cls:'d', name:esc(x.name), a:x.a, b:x.b, good:-1, excl:l.excl, scale:catScale}); });
    });
  });
  const allOpen=groups.every(g=>cmpOpen.has(g.key)), noneOpen=!cmpOpen.size && !cmpDetOpen.size;
  const sA=cmpShort(pa[0],pa[1])+(perMonth?' /m':''), sB=cmpShort(pb[0],pb[1])+(perMonth?' /m':'');
  wrap.innerHTML=`<div class="nwtools">`+
    (deselected.size ? `<span class="cmpexcl">${deselected.size} excluded</span>` : '')+
    `<button type="button" data-cmpall="open"${allOpen?' disabled':''}>Expand all</button>`+
    `<button type="button" data-cmpall="close"${noneOpen?' disabled':''}>Collapse all</button></div>`+
    `<table class="cmp"><thead><tr><th class="n">Category</th><th class="bar"></th><th class="dl">\u0394</th>`+
    `<th class="pc">%</th><th class="v" title="Period A">${esc(sA)}</th><th class="v" title="Period B">${esc(sB)}</th></tr></thead>`+
    `<tbody>${body}</tbody></table>`;
  const flip=(set,k)=>{ if(set.has(k)) set.delete(k); else set.add(k); renderCompare(); };
  const bind=(sel,attr,set)=> wrap.querySelectorAll(sel).forEach(tr=>{ const k=tr.getAttribute(attr);
    tr.addEventListener('click',e=>{ e.stopPropagation(); flip(set,k); });
    tr.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); flip(set,k); } }); });
  bind('tr[data-g]','data-g',cmpOpen);
  bind('tr[data-l]','data-l',cmpDetOpen);
  wrap.querySelectorAll('button[data-cmpall]').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
    if(b.getAttribute('data-cmpall')==='open') cmpOpen=new Set(groups.map(g=>g.key));
    else { cmpOpen=new Set(); cmpDetOpen=new Set(); }
    renderCompare(); }));
}

/* ---- Years of Life Paid: net worth / T12M expenses -------------------------
   One point per month, from the first month with 12 months of cash-flow history
   (META.minMi + 11) to the last complete month:
     years = month-end net worth / expenses of the 12 months ending that month
   Net worth is the same month-end series as the hero sparkline (running sum of every
   holding, earlier rows carried into the opening balance). When live prices are in,
   a last "Now" point = live net worth / the T12M expenses of the last 12 complete
   months. Which expenses count is picked in the flag list under the chart (one
   checkbox per label, grouped by macro group, kept in localStorage); entries
   excluded from metrics in the Sankey stay out too. Window-independent (ignores the
   range bar); K applies to the tooltip and the flag amounts, Avg/m changes nothing
   (a ratio of years). Behind the line: net worth (blue area, zero on the years zero
   line) and T12M expenses (orange area, own scale), shapes only. */
const YLP_KEY='finance-sankey-ylp-off-v1', YLP_COL='#7fd0a3';
/* background series (net worth, T12M expenses); expenses peak at YLP_EXP_H of the positive height */
const YLP_NW='#5b8fd0', YLP_EX='#d98a4a', YLP_EXP_H=0.5;
let ylpOff=new Set(), ylpOpen=false, ylpSig=null, ylpData=null, ylpLastW=0, NW_NOW=null, YLP_LIST=new Map(), YLP_LOCK=new Set();
function ylpLoad(){ try{ const a=JSON.parse(localStorage.getItem(YLP_KEY)||'[]'); if(Array.isArray(a)) ylpOff=new Set(a.map(String)); }catch(e){} }
function ylpSave(){ try{ localStorage.setItem(YLP_KEY, JSON.stringify([...ylpOff].sort())); }catch(e){} }
/* pure: [{mi, nw, exp, years}] for mi in [minMi+11, lastMi]. off = expense labels not
   counted, excluded = the Sankey Selection_State keys (E|leaf, EG|group). years is null
   when the counted T12M expenses are <= 0. */
function ylpSeries(data, holds, minMi, lastMi, off, excluded){
  const no=off||new Set(), ds=excluded||new Set(), sp={}, by={};
  (data||[]).forEach(([mi,k,grp,leaf,val])=>{
    if(k!=='E' || mi>lastMi || no.has(leaf) || ds.has('E|'+leaf) || ds.has('EG|'+grp)) return;
    sp[mi]=(sp[mi]||0)-val;                       // expenses stored negative -> positive spend
  });
  (holds||[]).forEach(h=>{ for(const k in h.flows) by[k]=(by[k]||0)+h.flows[k]; });
  let nw=0, s=0; const out=[];
  for(const k in by) if(+k<minMi) nw+=by[k];     // opening balance (incl. blank-date rows)
  for(let mi=minMi; mi<=lastMi; mi++){
    nw+=by[mi]||0; s+=sp[mi]||0; if(mi-12>=minMi) s-=sp[mi-12]||0;
    if(mi>=minMi+11) out.push({mi, nw, exp:s, years: s>0 ? nw/s : null});
  }
  return out;
}
function renderYlp(){
  if(!pageOn('life')) return;   // drawn when its page opens
  const svgEl=document.getElementById('ylpchart'), box=document.getElementById('ylpFlags');
  if(!svgEl || !box || !DATA.length) return;
  const W=Math.max(300, Math.round(svgEl.getBoundingClientRect().width || 900));
  const m0=META.minMi, m1=lastCompleteMi();
  const sig=[W, ylpOpen, showK, m1, NW_NOW ? Math.round(NW_NOW.v)+'@'+NW_NOW.at : '',
             [...ylpOff].sort().join(','), [...deselected].sort().join(',')].join('#');
  if(sig===ylpSig && DATA===ylpData) return;
  ylpSig=sig; ylpData=DATA; ylpLastW=W;
  const esc=s=> String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const el=(tag,attrs,txt)=>{ const e=document.createElementNS(NS,tag);
    for(const k in attrs) e.setAttribute(k,attrs[k]); if(txt!=null) e.textContent=txt; return e; };
  const yrs=v=>{ const r=Math.round(Math.abs(v)*10)/10; return (v<0&&r?'-':'')+r.toFixed(1).replace('.',','); };

  /* expense labels: primary group (largest all-time spend), T12M spend, locked when
     the Sankey excludes them */
  const gAmt={}, t12={};
  DATA.forEach(([mi,k,grp,leaf,val])=>{ if(k!=='E') return;
    const g=gAmt[leaf]||(gAmt[leaf]={}); g[grp]=(g[grp]||0)+Math.abs(val);
    if(mi>m1-12 && mi<=m1) t12[leaf]=(t12[leaf]||0)-val; });
  const primary=leaf=>{ const g=gAmt[leaf]; return Object.keys(g).sort((a,b)=>g[b]-g[a])[0]; };
  const locked=leaf=> deselected.has('E|'+leaf) || deselected.has('EG|'+primary(leaf));
  const counted=leaf=> !ylpOff.has(leaf) && !locked(leaf);
  YLP_LIST=new Map();
  Object.keys(gAmt).forEach(leaf=>{ const g=primary(leaf); if(!YLP_LIST.has(g)) YLP_LIST.set(g,[]); YLP_LIST.get(g).push(leaf); });
  const gOrd=g=>{ const i=ORDER.indexOf(g); return i<0?99:i; };
  const groups=[...YLP_LIST.keys()].sort((a,b)=> gOrd(a)-gOrd(b) || (a<b?-1:1));
  groups.forEach(g=> YLP_LIST.get(g).sort((a,b)=>rankCmp('E|'+a,'E|'+b)));
  const leaves=groups.flatMap(g=>YLP_LIST.get(g)), nCnt=leaves.filter(counted).length;
  YLP_LOCK=new Set(leaves.filter(locked));
  const cntEl=document.getElementById('ylpCnt');
  if(cntEl) cntEl.textContent = nCnt<leaves.length ? ' '+nCnt+'/'+leaves.length : '';

  /* series (+ the live "Now" point) */
  const pts=ylpSeries(DATA, NWHOLD, m0, m1, ylpOff, deselected);
  if(NW_NOW && pts.length){ const L=pts[pts.length-1];
    pts.push({mi:m1+1, nw:NW_NOW.v, exp:L.exp, years: L.exp>0 ? NW_NOW.v/L.exp : null, now:true}); }
  const N=pts.length, vals=pts.map(p=>p.years).filter(v=>v!=null), narrow=W<560, fs=narrow?9.5:10.5;
  svgEl.innerHTML='';
  if(N<2 || !vals.length){
    svgEl.setAttribute('viewBox',`0 0 ${W} 60`); svgEl.setAttribute('height',60);
    svgEl.appendChild(el('text',{x:W/2,y:34,'text-anchor':'middle',fill:'#9aa6bd','font-size':12},
      N<2 ? 'Needs 12 months of history' : 'No expenses counted'));
  } else {
    const padL=narrow?30:38, padR=narrow?40:46, plotTop=14, plotH=narrow?170:210, plotBot=plotTop+plotH, H=plotBot+22;
    const innerW=W-padL-padR, xOf=i=> padL+i/(N-1)*innerW;
    let yMax=Math.max(0,...vals), yMin=Math.min(0,...vals); if(yMax-yMin<1e-9) yMax=yMin+1;
    /* 1 / 2 / 5 steps (no 2.5, so whole-year ticks stay whole) */
    const raw=(yMax-yMin)/6, p10=Math.pow(10,Math.floor(Math.log10(raw))), f10=raw/p10;
    const step=(f10<=1.2?1:f10<=2.5?2:f10<=6?5:10)*p10;
    yMax=Math.ceil(yMax/step-1e-9)*step; yMin=Math.floor(yMin/step+1e-9)*step;
    const yOf=v=> plotTop+(yMax-v)/(yMax-yMin)*plotH;
    svgEl.setAttribute('viewBox',`0 0 ${W} ${H}`); svgEl.setAttribute('height',H);
    /* y grid in years (zero line stronger) */
    for(let t=yMin; t<=yMax+step*1e-6; t+=step){
      const y=yOf(t), z=Math.abs(t)<step*1e-6;
      svgEl.appendChild(el('line',{x1:padL,x2:W-padR,y1:y,y2:y,stroke:z?'#3a4d78':'#243049','stroke-width':1}));
      svgEl.appendChild(el('text',{x:padL-5,y:y+3.5,'text-anchor':'end',fill:'#9aa6bd','font-size':fs},
        (step>=1 ? String(Math.round(t)) : yrs(t))+'y'));
    }
    /* x labels: one per January (every other year when tight); the first point is
       labelled too when the first January is far enough away */
    const jan=[]; pts.forEach((p,i)=>{ if(!p.now && p.mi%12===0) jan.push(i); });
    const every=(innerW/Math.max(1,jan.length))<30 ? 2 : 1;
    const xl=(i,anchor)=>{ svgEl.appendChild(el('line',{x1:xOf(i),x2:xOf(i),y1:plotBot,y2:plotBot+4,stroke:'#3a4d78'}));
      svgEl.appendChild(el('text',{x:xOf(i),y:plotBot+15,'text-anchor':anchor,fill:'#e7ecf5','font-size':fs},String(Math.floor(pts[i].mi/12)))); };
    if(!jan.length || xOf(jan[0])-xOf(0)>34) xl(0,'start');
    jan.forEach((i,j)=>{ if(!(j%every)) xl(i,'middle'); });
    const z0=yOf(Math.max(yMin,Math.min(yMax,0)));
    const yC=u=> yOf(Math.max(yMin,Math.min(yMax,u)));
    /* area to the zero line + the line over the points idx; unit(i) = value in years-axis units */
    const series=(idx,unit,col,o)=>{
      const line='M'+idx.map(i=>xOf(i).toFixed(1)+','+yC(unit(i)).toFixed(1)).join('L');
      const area=line+`L${xOf(idx[idx.length-1]).toFixed(1)},${z0.toFixed(1)}L${xOf(idx[0]).toFixed(1)},${z0.toFixed(1)}Z`;
      svgEl.appendChild(el('path',{d:area,fill:col,'fill-opacity':o.fill,stroke:'none',class:o.cls+' area'}));
      svgEl.appendChild(el('path',{d:line,fill:'none',stroke:col,'stroke-width':o.w,'stroke-opacity':o.line,'stroke-linejoin':'round',class:o.cls+' line'}));
    };
    /* background, shapes only (values in the tooltip):
       net worth = area on a € scale whose zero sits on the years zero line, sized so the
         series fits; it crosses zero in the same month as the years line (same sign)
       T12M expenses = area on its own scale, peak at YLP_EXP_H of the positive height */
    const all=pts.map((p,i)=>i), nws=pts.map(p=>p.nw), exs=pts.map(p=>p.exp);
    const nwMax=Math.max(0,...nws), nwMin=Math.min(0,...nws);
    const kNw=Math.max(yMax>0 ? nwMax/yMax : 0, yMin<0 ? nwMin/yMin : 0) || 1;
    const exMax=Math.max(0,...exs), posU=yMax>0 ? yMax : yMax-yMin, kEx=exMax>0 ? exMax/(posU*YLP_EXP_H) : 1;
    const uNw=i=>pts[i].nw/kNw, uEx=i=>pts[i].exp/kEx;
    series(all, uNw, YLP_NW, {fill:.11, line:.6, w:1.3, cls:'bgnw'});
    series(all, uEx, YLP_EX, {fill:.045, line:.7, w:1.3, cls:'bgex'});   // light fill: orange on navy reads brown-red
    /* foreground: years paid, one piece per run of defined points */
    const runs=[]; let cur=null;
    pts.forEach((p,i)=>{ if(p.years==null){ cur=null; return; } if(!cur){ cur=[]; runs.push(cur); } cur.push(i); });
    runs.forEach(r=> series(r, i=>pts[i].years, YLP_COL, {fill:.16, line:1, w:2, cls:'yrs'}));
    /* last value labelled at the right end; the live point gets a ring */
    let li=N-1; while(li>=0 && pts[li].years==null) li--;
    if(li>=0){ const p=pts[li];
      svgEl.appendChild(el('circle',{cx:xOf(li),cy:yOf(p.years),r:p.now?3.6:2.8,fill:p.now?'#0f1420':YLP_COL,stroke:YLP_COL,'stroke-width':p.now?1.8:0}));
      svgEl.appendChild(el('text',{x:xOf(li)+6,y:yOf(p.years)+4,fill:YLP_COL,'font-size':fs+0.5,'font-weight':700},yrs(p.years)+'y')); }
    /* hover / tap: nearest month, guide line + a dot on each series + tooltip */
    const guide=el('line',{x1:0,x2:0,y1:plotTop,y2:plotBot,stroke:'rgba(231,236,245,.55)','stroke-width':1,visibility:'hidden'});
    const dNw=el('circle',{cx:0,cy:0,r:2.6,fill:YLP_NW,visibility:'hidden'}),
          dEx=el('circle',{cx:0,cy:0,r:2.6,fill:YLP_EX,visibility:'hidden'}),
          dot=el('circle',{cx:0,cy:0,r:3.4,fill:YLP_COL,visibility:'hidden'});
    [guide,dNw,dEx,dot].forEach(x=>svgEl.appendChild(x));
    const mut=s=>`<span style="color:#9aa6bd">${s}</span>`;
    const nOff=leaves.length-nCnt;
    const hhmm=t=>{ const d=new Date(t); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
    const tipHtml=i=>{ const p=pts[i];
      let h=p.now ? `<b>Now</b> <b style="color:${YLP_COL}">LIVE</b> ${mut(hhmm(NW_NOW.at))}` : `<b>${miLabel(p.mi)}</b>`;
      h+=`<br><i class="sw" style="background:${YLP_COL}"></i>Years paid <b>${p.years==null?'\u2014':yrs(p.years)}</b>`+
         `<br><i class="sw" style="background:${YLP_NW}"></i>Net worth <b>${fmt(p.nw)}</b>`+
         `<br><i class="sw" style="background:${YLP_EX}"></i>T12M expenses <b>${fmt(p.exp)}</b> `+
         mut(`\u00b7 ${fmt(p.exp/12)}/m`+(p.now?` (${cmpShort(m1-11,m1)})`:''));
      if(nOff) h+=`<br><span style="color:#e7c14a">${nOff} expense${nOff>1?'s':''} not counted</span>`;
      return h; };
    const hit=el('rect',{class:'hit',x:padL,y:0,width:innerW,height:H});
    const at=(d,i,u,c)=>{ d.setAttribute('cx',xOf(i)); d.setAttribute('cy',yC(u)); d.setAttribute('fill',c); d.setAttribute('visibility','visible'); };
    const hideDots=()=>[guide,dNw,dEx,dot].forEach(x=>x.setAttribute('visibility','hidden'));
    const show=e=>{ const r=svgEl.getBoundingClientRect(), x=(e.clientX-r.left)*(W/r.width);
      const i=Math.max(0,Math.min(N-1,Math.round((x-padL)/innerW*(N-1)))), p=pts[i];
      guide.setAttribute('x1',xOf(i)); guide.setAttribute('x2',xOf(i)); guide.setAttribute('visibility','visible');
      at(dNw,i,uNw(i),YLP_NW); at(dEx,i,uEx(i),YLP_EX);
      if(p.years!=null) at(dot,i,p.years,YLP_COL); else dot.setAttribute('visibility','hidden');
      showTip(e,tipHtml(i)); const tw=tip.offsetWidth, th=tip.offsetHeight;
      if(e.clientX+12+tw>window.innerWidth) tip.style.left=Math.max(4,e.clientX-12-tw)+'px';
      if(e.clientY+12+th>window.innerHeight) tip.style.top=Math.max(4,e.clientY-12-th)+'px'; };
    hit.addEventListener('mousemove',show);

    `<button type="button" data-ylpall="on"${free.every(l=>!ylpOff.has(l))?' disabled':''}>Select all</button>`+
    `<button type="button" data-ylpall="off"${free.every(l=>ylpOff.has(l))?' disabled':''}>Select none</button></div>`;
  groups.forEach(g=>{
    const ls=YLP_LIST.get(g), fr=ls.filter(l=>!locked(l)), on=fr.filter(l=>!ylpOff.has(l)).length;

       `<input type="checkbox" data-g="${esc(g)}"${st}${on && on<fr.length?' data-ind="1"':''}>`+
       `<span class="nm">${esc(g)}</span><span class="amt">${amt(ls.reduce((a,l)=>a+(t12[l]||0),0))}</span></label><div class="ylpitems">`;
    ls.forEach(l=>{ const lk=locked(l), c=counted(l);
      h+=`<label class="${lk?'lock':c?'':'off'}"${lk?' title="Excluded from metrics (Include all brings it back)"':''}>`+
         `<input type="checkbox" data-l="${esc(l)}"${c?' checked':''}${lk?' disabled':''}>`+
         `<span class="nm">${esc(l)}</span><span class="amt">${amt(t12[l])}</span></label>`; });
    h+=`</div></div>`;
  });
  box.innerHTML=h;
  box.querySelectorAll('input[data-ind]').forEach(i=>{ i.indeterminate=true; });

/* ---- main build ---------------------------------------------------------- */
function build(){
  curMiF=META.minMi+loIdx; curMiT=META.minMi+hiIdx;
  syncExclUI();
  /* the Sankey, its cards and the detail panel live on the Cash Flow page; elsewhere only
     the chart of the page on screen redraws (the others return early) */
  if(pageOn('cashflow')) buildSankey();
  renderCashBars(); renderCompare(); renderYlp();
}
function buildSankey(){
  const raw=computeLinks(curMiF,curMiT); const monthly=monthlyEl.checked; curDiv=monthly?raw.months:1;
  /* filter the diagram by the current Selection_State before sizing/painting, so
     render() and paintTotals() consume the selection-adjusted result; res.hidden
     drives the greyed stubs and res.ghosts their dimmed connectors. */
  const res=applySelection(raw, deselected);
  res.ghosts=ghostLinks(raw, res);
  curScale = TARGET_H / scaleReferenceFor(modeEl.value, monthly, META.refs);   // per-Comparison_Mode reference: consistent within a mode, adaptive across modes
  let plabel=`${miLabel(curMiF)} — ${miLabel(curMiT)}`;
  if(monthly && res.months>0){
    res.links=res.links.map(([s,t,v])=>[s,t,v/res.months]); res.income/=res.months; res.sav/=res.months;
    for(const g in res.expGrp) res.expGrp[g]/=res.months;
    plabel += ` · per-month average over ${res.months} month${res.months>1?'s':''}`;
  }
  document.getElementById('periodLabel').textContent=plabel;
  paintTotals(res); render(res);
  /* If the Detail_Panel is open, refresh it against the new window/mode so ANY
     Period_Selector change (Quick-set dropdown, year/month pickers, range-bar
     drag/resize, per-month toggle) follows through to the overlay WITHOUT tearing
     down the Sankey or the Selection_State. renderPanel() reads the freshly
     updated curMiF/curMiT and no-ops when the panel is closed. */
  renderPanel();
}
/* excluded-entries pill: shows how many entries are out of the metrics and offers

/* ---- data cache (stale-while-revalidate) --------------------------------- */
/* Stores a SNAPSHOT of the crunched data (DATA, DETAIL, NWHOLD, META, ~0.3 MB) plus a
   fingerprint of the CSV it came from, in the visitor's own browser (localStorage).
   A returning visit paints straight from the snapshot: no CSV parse, no aggregate().
   The background refresh only re-crunches when the fingerprint changed. The old v1
   cache held the raw 2.4 MB CSV (~6 MB as stored), which was slow to read, close to
   the browser quota, and still needed a full parse on every open; it is deleted.
   Nothing is transmitted anywhere except the existing public Google Sheets endpoint. */
const SheetCache={
  KEY:"finance-sankey-cache-v2",
  OLD_KEYS:["finance-sankey-cache-v1"],
  MAX_AGE_MS:30*24*60*60*1000,   // a snapshot up to 30 days old is shown while the refresh runs
  available(){ try{ const k="__fs_probe__"; localStorage.setItem(k,"1"); localStorage.removeItem(k); return true; }catch(e){ return false; } },
  dropOld(){ try{ this.OLD_KEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){} },
  read(){ try{ const raw=localStorage.getItem(this.KEY); if(!raw) return {ok:false};
      const entry=JSON.parse(raw);
      if(!entry || entry.v!==2 || typeof entry.hash!=='string' || typeof entry.retrievedAt!=='number' ||
         !Array.isArray(entry.data) || !entry.data.length || !Array.isArray(entry.hold) || !entry.meta) return {ok:false};
      return {ok:true, entry}; }catch(e){ return {ok:false}; } },
  /* snapshot of what is loaded right now (call after applyData / applySnapshot) */
  /* bump KEY (and v) whenever aggregate() changes the shape or meaning of what is stored */
  write(hash,retrievedAt){ try{ localStorage.setItem(this.KEY, JSON.stringify({v:2, hash, retrievedAt,
      data:DATA, detail:DETAIL, hold:NWHOLD, meta:META})); return true; }catch(e){ return false; } },
  isFresh(entry,now){ return !!entry && typeof entry.retrievedAt==='number' && (now-entry.retrievedAt) <= this.MAX_AGE_MS; },
  differs(entry,hash){ return !entry || entry.hash!==hash; }
};

/* ---- fetch with bounded retry (<=3) + 10s per-attempt timeout ------------ */
async function fetchText(url){
  let signal, to;
  if(typeof AbortController==='function'){ const ctrl=new AbortController(); signal=ctrl.signal; to=setTimeout(()=>ctrl.abort(),10000); }
  try{
    const resp=await fetch(url, signal?{cache:"no-store",signal}:{cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP "+resp.status);
    return await resp.text();
  } finally { if(to) clearTimeout(to); }
}
/* slim query first (attempts 1-2); if Google answers but the answer does not look right
   (columns moved, error page), or on the last attempt, read the full export instead and
   re-learn the column letters from its header for next time */
async function fetchSheet(){
  let lastErr;
  for(let attempt=0; attempt<3; attempt++){
    try{
      if(attempt<2){ const t=await fetchText(slimURL(slimCols())); if(slimOk(t)) return t; }
      const full=await fetchText(CSV_URL), nl=full.indexOf('\n');
      const c=learnCols(parseCSV(nl<0?full:full.slice(0,nl))[0]);
      if(c){ try{ localStorage.setItem(SLIM_KEY, JSON.stringify(c)); }catch(e){} }
      return full;
    }catch(e){ lastErr=e; if(attempt<2) await new Promise(r=>setTimeout(r,400*(attempt+1))); }
  }
  throw lastErr || new Error("fetch failed");
}

/* ---- live ETF values: READ-ONLY GETs of the public gviz export, never a write ----
   LIST!V:Y     = KEY | BROKER | ETF | shares held.
   NETWORTH!A:Q = the sheet's own net worth table; column F is shares x GOOGLEFINANCE
                  price for the live rows, so price per share = F / shares.
   The assets table then values each ETF holding as shares x live price, and the
   CAPGAIN liability (tax on unrealised gains) takes its live value from the same
   table, since it moves with the prices. Best-effort: on any failure the DB values
   stay on screen. Refreshed every 5 min while the page is visible. */
const gvizURL=(sheet,range)=>`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0`+
  `&sheet=${encodeURIComponent(sheet)}&range=${encodeURIComponent(range)}`;
let LIVE=null;   // {hold:{'DEGIRO|VWCE':{shares,price,value}}, capgain:number|null, at:ms}
async function fetchGviz(url){
  let signal,to;
  if(typeof AbortController==='function'){ const c=new AbortController(); signal=c.signal; to=setTimeout(()=>c.abort(),10000); }
  const resp=await fetch(url, signal?{cache:"no-store",signal}:{cache:"no-store"});
  if(to) clearTimeout(to);
  if(!resp.ok) throw new Error("HTTP "+resp.status);
  const t=await resp.text(), a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0||b<a) throw new Error("not a gviz response");
  const j=JSON.parse(t.slice(a,b+1));
  if(j.status!=='ok' || !j.table) throw new Error("gviz "+j.status);
  return j.table.rows.map(r=>(r.c||[]).map(c=> c==null ? null : c.v));
}
let liveBusy=false, liveAt=0;   // liveAt = last live check (auto refresh, see autoTick)
async function loadLive(){
  if(liveBusy) return; liveBusy=true; liveAt=Date.now();
  try{
    const [list,nw]=await Promise.all([fetchGviz(gvizURL('LIST','V2:Y60')), fetchGviz(gvizURL('NETWORTH','A11:O80'))]);
    /* investment gains = the NETWORTH totals row (A = "VARIABILITY"): H/I month,
       K/L year, N/O all time (sum of the per-holding deltas, GOOGLEFINANCE-live) */
    const num=x=> typeof x==='number' && isFinite(x) ? x : null;
    const tr=nw.find(r=>norm(r[0])==='VARIABILITY');
    const inv = tr ? {m:[num(tr[7]),num(tr[8])], y:[num(tr[10]),num(tr[11])], a:[num(tr[13]),num(tr[14])]} : null;
    const shares={};
    list.forEach(r=>{ const br=norm(r[1]), etf=norm(r[2]), n=Number(r[3]);
      if(br && etf && isFinite(n) && n>0) shares[br+'|'+etf]=n; });
    const hold={}; let capgain=null;
    nw.forEach(r=>{ const etf=norm(r[2]), acct=norm(r[3]), cat=norm(r[4]), v=r[5];
      if(typeof v!=='number' || !isFinite(v)) return;
      const k=acct+'|'+etf;
      if(shares[k]) hold[k]={shares:shares[k], price:v/shares[k], value:v};
      if(acct==='CAPGAIN' && cat==='LIABILITIES') capgain=v; });
    if(Object.keys(hold).length){ LIVE={hold,capgain,inv,at:Date.now()}; if(controlsReady) buildNetWorth(); }
  }catch(e){ /* keep the DB values on screen */ }
  finally{ liveBusy=false; }
}

/* ---- page switching ----------------------------------------------------------
   showPage(): remember the scroll of the page being left, close the hover / detail
   overlays, show the new page, move the Avg/m | K toggles into it, draw it, and put
   back its own scroll position. The Sankey and the net worth tables redraw on entry
   (a few ms); the three charts skip the redraw when nothing they show has changed. */
const pageScroll={};
function syncPageUI(){
  document.body.setAttribute('data-page',PAGE);
  document.querySelectorAll('section.page').forEach(s=>{ s.hidden = !controlsReady || s.getAttribute('data-page')!==PAGE; });
  document.querySelectorAll('#tabs a[data-page]').forEach(a=>{
    if(a.getAttribute('data-page')===PAGE) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  /* one Avg/m | K element: back in the controls row on Cash Flow, else in the page header */
  const tg=document.getElementById('toggles');
  if(tg){
    if(PAGE==='cashflow'){ const c=document.getElementById('controls'), ex=document.getElementById('exclBox');
      if(tg.parentNode!==c) c.insertBefore(tg,ex); }
    else { const slot=document.querySelector('#pg-'+PAGE+' .tgslot'); if(slot && tg.parentNode!==slot) slot.appendChild(tg); }
  }
  syncSticky();
}
function renderPage(){
  if(!controlsReady) return;
  if(PAGE==='cashflow') build();
  else if(PAGE==='networth') buildNetWorth();
  else if(PAGE==='savings') renderCashBars();
  else if(PAGE==='compare') renderCompare();
  else if(PAGE==='life') renderYlp();
}
function showPage(p, fromHash){
  if(PAGES.indexOf(p)<0 || p===PAGE) return;
  pageScroll[PAGE]=window.scrollY;
  hideMini(); hideTip(); if(panel) closePanel();
  PAGE=p;
  try{ localStorage.setItem(PAGE_KEY,p); }catch(e){}
  if(!fromHash && location.hash!=='#'+p){ try{ history.replaceState(null,'','#'+p); }catch(e){} }
  syncPageUI(); renderPage();
  window.scrollTo(0, pageScroll[p]||0);
  syncSticky();
}
document.getElementById('tabs').addEventListener('click',e=>{
  const a=e.target.closest && e.target.closest('a[data-page]'); if(!a) return;
  e.preventDefault(); e.stopPropagation(); showPage(a.getAttribute('data-page'));
});
window.addEventListener('hashchange',()=>{ const h=pageFromHash(); if(h) showPage(h,true); });
/* sticky bars: on wide screens the tab row sticks at the top and the Cash Flow controls
   stick right under it (--tabsh); on phones the tabs are a fixed bottom bar, so the
   controls stick at the top. Each gets a soft shadow while it floats over the content. */
let stickyTop=0, tabsSticky=false;
function measureSticky(){
  const t=document.getElementById('tabs');
  tabsSticky=!!t && getComputedStyle(t).position==='sticky';
  const h=tabsSticky ? t.offsetHeight : 0;
  if(h!==stickyTop){ stickyTop=h; document.documentElement.style.setProperty('--tabsh', h+'px'); }
}
function onScrollSticky(){
  const t=document.getElementById('tabs'), c=document.getElementById('controls'), y=window.scrollY>0;
  if(t) t.classList.toggle('stuck', tabsSticky && y && t.getBoundingClientRect().top<=0.5);
  if(c && pageOn('cashflow') && c.style.display!=='none')
    c.classList.toggle('stuck', y && c.getBoundingClientRect().top<=stickyTop+0.5);
}
function syncSticky(){ measureSticky(); onScrollSticky(); }
window.addEventListener('scroll',onScrollSticky,{passive:true});
window.addEventListener('resize',syncSticky);
/* only the page on screen draws anything (each renderer returns early while its page is
   hidden); buildNetWorth() still runs to keep the live net worth (NW_NOW) current */
function renderAll(){ build(); buildNetWorth(); }
function applyData(csv){ aggregate(parseCSV(csv)); afterData(); }
/* returning visit: install the cached snapshot as-is (RANK is rebuilt, it is cheap) */
function applySnapshot(e){
  DATA=e.data; DETAIL=e.detail||[]; NWHOLD=e.hold; META=e.meta;
  RANK=stableRank(DATA, DETAIL, META.maxMi);
  afterData();
}
function afterData(){
  if(!DATA.length) throw new Error("No usable rows (check the sheet is shared 'anyone with the link → Viewer' and named DB).");
  syncYearOptions();
  initControlsOnce();
  const N=maxIdx();                            // keep the user's window on a refresh, clamp to new bounds
  if(hiIdx>N) hiIdx=N; if(loIdx>hiIdx) loIdx=Math.max(0,hiIdx); updateSliderUI();
  statusEl.style.display='none'; hideSkeleton();
  renderAll();
}
function showBadge(retrievedAt,refreshing){
  if(!badgeEl) return;
  const d=new Date(retrievedAt); const t=(retrievedAt && !isNaN(d.getTime()))?` (from ${d.toLocaleString()})`:'';
  badgeEl.textContent=`Showing last loaded data${t}`+(refreshing?' — refreshing…':'');
  badgeEl.style.display='';
}
function clearBadge(){ if(badgeEl) badgeEl.style.display='none'; }
function hideSkeleton(){ const s=document.getElementById('skeleton'); if(s) s.style.display='none'; }
function showError(msg,timedOut){
  hideSkeleton();
  statusEl.style.display=''; statusEl.className='status err';
  statusEl.innerHTML = timedOut
    ? `Loading timed out.<br>Check your connection and that the Google Sheet is shared as <b>“Anyone with the link → Viewer”</b> and has a tab named <b>DB</b>.`
    : `Could not load the sheet: ${msg}<br>Make sure the Google Sheet is shared as <b>“Anyone with the link → Viewer”</b> and has a tab named <b>DB</b>.`;
}

/* ---- boot: render cached data first, refresh live in the background ------ */
/* ---- auto refresh -------------------------------------------------------------
   While the tab is visible: the DB sheet every 10 min, the live ETF values every 5 min
   (GOOGLEFINANCE itself only moves every ~20 min). Coming back to the tab or window,
   back online, or out of the back-forward cache checks straight away when the last
   check is older than 2 min (DB) / 1 min (live). A hidden tab fetches nothing.
   Silent: same fingerprint = nothing redrawn; new data = applyData(), which keeps the
   page, the window, the exclusions, the toggles and every open row; a failed check
   keeps what is on screen and the next tick retries. Never redraws under a range-bar
   drag (waits for it to end). */
const DB_EVERY=10*60*1000, DB_STALE=2*60*1000, LIVE_EVERY=5*60*1000, LIVE_STALE=60*1000;
let dbAt=0, dbBusy=false, dbHash=null;   // last DB check, in flight, fingerprint on screen
async function refreshDB(){
  if(dbBusy || document.hidden) return;
  dbBusy=true; dbAt=Date.now();
  try{
    const csv=await fetchSheet(), h=csvHash(csv), t=Date.now();
    if(h!==dbHash){
      await new Promise(res=>{ (function wait(){ if(drag) setTimeout(wait,400); else res(); })(); });
      applyData(csv); dbHash=h; SheetCache.write(h,t);
    } else {                                   // unchanged: re-stamp the snapshot twice a day
      const c=SheetCache.read(); if(!c.ok || t-c.entry.retrievedAt>12*60*60*1000) SheetCache.write(h,t);
    }
    clearBadge();
  }catch(e){ /* keep what is on screen; the next tick retries */ }
  finally{ dbBusy=false; }
}
function autoTick(back){
  if(document.hidden) return;
  const now=Date.now();
  if(now-liveAt >= (back ? LIVE_STALE : LIVE_EVERY)) loadLive();
  if(now-dbAt >= (back ? DB_STALE : DB_EVERY)) refreshDB();
}

/* ---- boot: render cached data first, refresh live in the background ------ */
function boot(){
  syncPageUI();                                // highlight the tab of the page to open (pages show once data is in)
  loadLive();                                  // live ETF values, in parallel with the DB load
  setInterval(()=>autoTick(false), 30*1000);
  document.addEventListener('visibilitychange',()=>autoTick(true));
  window.addEventListener('focus',()=>autoTick(true));
  window.addEventListener('online',()=>autoTick(true));
  window.addEventListener('pageshow',e=>{ if(e.persisted) autoTick(true); });
  SheetCache.dropOld();                        // the old raw-CSV cache (v1) is no longer read
  const cached=SheetCache.read(), now=Date.now();
  let renderedFromCache=false, settled=false;
  if(cached.ok && SheetCache.isFresh(cached.entry,now)){
    try{ applySnapshot(cached.entry); renderedFromCache=true; dbHash=cached.entry.hash; showBadge(cached.entry.retrievedAt,true); }catch(e){ renderedFromCache=false; }
  }
  const overall=setTimeout(()=>{ if(!settled && !renderedFromCache) showError('',true); },30000);
  dbBusy=true; dbAt=Date.now();
  fetchSheet().then(csv=>{
    settled=true; clearTimeout(overall);
    const h=csvHash(csv), t=Date.now(); dbHash=h;
    if(renderedFromCache){
      /* same fingerprint: nothing to redo, just re-stamp the snapshot twice a day so it
         stays inside MAX_AGE; new data: crunch it, redraw the page, replace the snapshot */
      if(SheetCache.differs(cached.entry,h)){ applyData(csv); SheetCache.write(h,t); }
      else if(t-cached.entry.retrievedAt > 12*60*60*1000) SheetCache.write(h,t);
      clearBadge();                            // live data confirmed current
    }else{
      applyData(csv); SheetCache.write(h,Date.now()); clearBadge();
    }
  }).catch(err=>{
    settled=true; clearTimeout(overall);
    if(renderedFromCache){ showBadge(cached.entry.retrievedAt,false); return; }        // keep cached data on screen
    if(cached.ok){ try{ applySnapshot(cached.entry); dbHash=cached.entry.hash; showBadge(cached.entry.retrievedAt,false); return; }catch(e){} }  // fall back to stale cache
    showError(err && err.message ? err.message : 'load failed');
  }).finally(()=>{ dbBusy=false; });
}
/* tap/click away closes the hover preview and the detail panel (the panel itself
   stops propagation, and node clicks do too, so neither closes on its own click) */
document.addEventListener('click',()=>{ hideMini(); hideTip(); if(panel) closePanel(); });
boot();

/* ---- test-only export shim ------------------------------------------------
   Exposes the pure helpers to the Node test harness (fast-check).
   Guarded so it is completely inert in the browser: there is no `module`
   global on the shipped single-file page, so this block never runs and adds
   no external dependency or runtime cost. The export list grows as each pure
   helper (SheetCache, thickness, idxFromClientX, isMobile, ...) lands in a
   later task; only helpers that already exist are referenced here. */
if (typeof module !== 'undefined' && module.exports) {
  module.exports = { parseCSV, aggregate, computeLinks, applySelection, detailFor, SheetCache, fetchSheet, isMobile, MOBILE_BP, scaleReferenceFor, savingsPercentage, monthlySeries, cashFlowByYear, cfSeriesByYear, cfRollLayers, rolling12, periodSums, comparePeriods, ylpSeries, slimURL, learnCols, slimOk, csvHash };
}
